<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roteiro Inteligente - ALRS</title>
<!-- Vue.js via CDN (Zero Servidor) -->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<!-- Mammoth.js (Para ler arquivos .docx) -->
<script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>

<style>
/* ==========================================================================
   CSS DO DOCUMENTO (Aparência de Papel A4 e Impressão)
   ========================================================================== */
:root { --bg-app: #e5e7eb; --doc-bg: #ffffff; --text-main: #000000; --text-instrucao: #C00000; --border-color: #000000; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: var(--bg-app); font-family: Arial, Helvetica, sans-serif; color: var(--text-main); line-height: 1.4; }

/* --- BARRA DE CONTROLE --- */
.no-print { display: block; }
#painel-controle {
    background: #1e293b; color: white; padding: 15px 20px; position: sticky; top: 0; z-index: 100; display: flex; gap: 15px; align-items: flex-start; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
}
#painel-controle textarea { flex: 1; height: 85px; padding: 8px; font-family: monospace; font-size: 12px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #e2e8f0; }
.btn-group { display: flex; flex-direction: column; gap: 6px; width: 250px;}
button { padding: 7px 10px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 11px; text-transform: uppercase; }
.btn-primary { background: #3b82f6; color: white; } .btn-primary:hover { background: #2563eb; }
.btn-secundary { background: #64748b; color: white; } .btn-secundary:hover { background: #475569; }
.btn-danger { background: #ef4444; color: white; } .btn-danger:hover { background: #dc2626; }
.btn-print { background: #10b981; color: white; }
.btn-resumo { background: #f59e0b; color: white; } .btn-resumo:hover { background: #d97706; }
.btn-row { display: flex; gap: 6px; } .btn-row button { flex: 1; }

/* --- A FOLHA A4 --- */
.folha-a4 { background: var(--doc-bg); width: 210mm; min-height: 297mm; margin: 30px auto; padding: 20mm 15mm; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); font-size: 11pt; }
h3, h4 { text-align: center; margin-bottom: 5px; }
.cabecalho-doc { padding-bottom: 15px; margin-bottom: 15px; }
.titulo-roteiro { border-top: 2px solid var(--border-color); border-bottom: 2px solid var(--border-color); padding: 8px; text-align: center; font-weight: bold; margin-bottom: 20px;}
.instrucao { color: var(--text-instrucao); font-style: italic; font-weight: bold; text-align: center; margin: 15px 0;}
.instrucao-inline { color: var(--text-instrucao); font-style: italic; font-weight: bold; }
.item-texto { margin-bottom: 10px; text-align: justify; }
.item-destaque { background: #e2e2e2; padding: 5px; font-weight: bold; font-size: 12pt; border: 1px solid var(--border-color); margin-bottom: 10px; -webkit-print-color-adjust: exact; print-color-adjust: exact;}
.item-ordem-dia { margin-bottom: 40px; page-break-inside: avoid; }

/* CAIXAS DE SEÇÃO */
.caixa-secao { border: 2px solid var(--border-color); background-color: #e2e2e2; text-align: center; font-weight: bold; text-transform: uppercase; padding: 6px; margin: 30px 0 15px 0; font-size: 12pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

/* Tabelas */
table { width: 100%; border-collapse: collapse; margin: 15px 0; page-break-inside: avoid; }
th, td { border: 1px solid var(--border-color); padding: 6px 4px; text-align: left; vertical-align: middle; }
th { background-color: #f1f1f1; font-weight: bold; text-align: center; -webkit-print-color-adjust: exact; print-color-adjust: exact;}
.col-check { width: 30px; text-align: center; font-weight: bold;}
.col-nome { width: 42%; font-size: 10pt; }

/* Tabela de Vistas */
.tabela-vista { width: auto; margin: 10px auto; border-collapse: collapse; font-size: 10pt; }
.tabela-vista th, .tabela-vista td { border: 1px solid #000; padding: 4px 10px; text-align: center; font-weight: bold; }
.tabela-vista th.label-vista { background-color: #e2e2e2; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

/* --- INTERATIVIDADE --- */
.interativo .cell-clicavel { cursor: pointer; transition: background 0.1s; }
.interativo .cell-clicavel:hover { background-color: #dbeafe; }
.marcacao { font-size: 14pt; font-weight: bold; }
.marcacao.ok { color: #16a34a; }
.marcacao.nok { color: #dc2626; }
select.select-roteiro, input.input-roteiro { width: 100%; padding: 4px; font-family: inherit; font-size: 10pt; border: 1px dashed #ccc; background: #f8fafc; margin-top: 4px;}
.linha-vazia { display: inline-block; width: 50px; border-bottom: 1px solid black; text-align: center; font-weight: bold;}
.marcacao-x { display: inline-block; width: 16px; text-align: center; font-weight: bold; color: var(--accent); cursor: pointer;}

/* Layout Matérias a Distribuir Lado a Lado */
.distribuicao-container { display: flex; gap: 20px; align-items: stretch; margin-bottom: 20px; }
.distribuicao-tabela-box { flex: 0 0 45%; }
.distribuicao-tabela-box table { margin: 0; font-size: 9pt; }
.distribuicao-tabela-box th, .distribuicao-tabela-box td { padding: 4px; }
.distribuicao-texto-box { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
.linha-destaque { background-color: #fcd34d !important; font-weight: bold; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.linha-impedida { color: #999; text-decoration: line-through; }

/* Calendários */
.calendarios-container { display: flex; justify-content: center; gap: 20px; margin-top: 30px; page-break-inside: avoid;}
.calendario { border: 1px solid #ccc; padding: 10px; border-radius: 4px; font-size: 9pt; width: 180px;}
.cal-mes { text-align: center; font-weight: bold; margin-bottom: 8px; text-transform: uppercase;}
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 2px; }
.cal-header { font-weight: bold; color: #666; font-size: 8pt;}
.cal-day.domingo { color: red; font-weight: bold;}
.cal-day.vazio { color: transparent; }

@media print {
    .no-print { display: none !important; }
    body { background: none; }
    .folha-a4 { margin: 0; padding: 0; box-shadow: none; width: 100%; min-height: auto; }
    table, .calendarios-container { page-break-inside: avoid; }
    .caixa-secao { page-break-after: avoid; }
    @page { margin: 15mm; }
}
</style>
</head>
<body>

<div id="app">
    <!-- PAINEL DE CONTROLE -->
    <div id="painel-controle" class="no-print">
        <div style="flex: 1; display: flex; flex-direction: column; gap: 8px;">
            <div style="background: #334155; padding: 5px 10px; border-radius: 4px; display: flex; align-items: center; gap: 10px;">
                <span style="font-size: 11px; font-weight: bold; color: #94a3b8;">📂 IMPORTAR AGENDA DOCX:</span>
                <input type="file" accept=".docx" @change="lerDocx" style="font-size: 11px; color: #fff; cursor: pointer;">
            </div>
            <textarea v-model="textoAgenda" placeholder="Ou cole o texto da AGENDA corporativa aqui..."></textarea>
        </div>
        <div class="btn-group">
            <button class="btn-primary" @click="processarAgenda" :disabled="!textoAgenda">1. Processar Agenda</button>
            <button class="btn-secundary" @click="modoInterativo = !modoInterativo" :disabled="!pautaProcessada">
                {{ modoInterativo ? '👁 Voltar p/ Leitura (Impressão)' : '✍️ Ativar Preenchimento' }}
            </button>
            <div class="btn-row">
                <button class="btn-resumo" @click="copiarResumo" :disabled="!pautaProcessada">📋 Resumo</button>
                <button class="btn-print" @click="imprimir" :disabled="!pautaProcessada">🖨️ Imprimir</button>
            </div>
            <button class="btn-danger" @click="limparTudo">🗑 Limpar Tudo</button>
        </div>
    </div>

    <!-- DOCUMENTO A4 -->
    <div class="folha-a4" :class="{ 'interativo': modoInterativo }">
        
        <div v-if="!pautaProcessada" style="text-align: center; color: #666; padding-top: 50px;">
            <h2>Bem-vindo ao Roteiro Inteligente</h2>
            <p>O Assistente Regimental com Banco de Dados Oficial e Auto-Save.<br>Cole o texto da agenda e processe para gerar o documento.</p>
        </div>

        <template v-else>
            <!-- CABEÇALHO -->
            <div class="cabecalho-doc">
                <h3>ASSEMBLEIA LEGISLATIVA DO ESTADO DO RIO GRANDE DO SUL</h3>
                <h4 style="font-weight: normal; margin-top: 8px;">{{ nomeComissaoMinusc }}</h4>
            </div>

            <div class="titulo-roteiro">
                {{ formatarData(pauta.metadados.data) }} – {{ pauta.metadados.hora_inicio }} – {{ pauta.metadados.local }}<br>
                REUNIÃO {{ (pauta.metadados.tipo_reuniao || 'Ordinária').toUpperCase() }}
            </div>

            <div class="instrucao">
                AVISAR A EQUIPE DA TV SOBRE A ABERTURA DA REUNIÃO EM INSTANTES (UM MINUTO)<br>
                <span style="font-size: 10pt; color: #000; font-weight: normal; font-style: normal;">
                    <i>para abertura, necessária presença mínima de {{ quorumMinimoAbertura }} Deputados (metade + 1)</i><br><br>
                    <i>se decorridos 15 minutos não houver sido atingido o quórum, o Presidente declarará conforme Art. 59. § 1 .º do Regimento Interno da Assembleia Legislativa, sem o quórum necessário, com a presença dos deputados XXXX, a reunião deixa de realizar-se, com o fato sendo registrado em Ata Declaratória</i>
                </span>
            </div>

            <!-- ABERTURA DINÂMICA -->
            <p style="text-align: justify; font-size: 12pt; line-height: 1.5;">
                <strong>HAVENDO QUÓRUM REGIMENTAL, DECLARO ABERTA A REUNIÃO {{ (pauta.metadados.tipo_reuniao || 'Ordinária').toUpperCase() }} 
                {{ (pauta.metadados.modalidade || 'Presencial').toUpperCase() }} DA 
                {{ (pauta.metadados.sigla || 'COMISSÃO').toUpperCase() }} NESTA<br><br>
                <div style="text-align: center; font-size: 14pt;">
                    <span style="font-weight: bold;">{{ textoAberturaDinamico }}</span>
                </div>
                </strong>
            </p>

            <div style="text-align: center; font-size: 10pt; margin-top: 15px; margin-bottom: 10px;">
                Presidente nomina cada um dos Parlamentares presentes, solicitando manifestação ao microfone para registro documental.
            </div>

            <!-- TABELA DE PRESENÇA (ABERTURA) -->
            <table>
                <thead>
                    <tr>
                        <th class="col-nome">MEMBROS TITULARES</th>
                        <th class="col-check">✓</th>
                        <th class="col-nome">MEMBROS SUPLENTES</th>
                        <th class="col-check">✓</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(linha, index) in tabelaMembros" :key="'abert'+index">
                        <td class="col-nome">{{ linha.titular ? `${linha.titular.nome} (${linha.titular.partido})${linha.titular.isPresidente ? ' | Presidente' : ''}` : '' }}</td>
                        <td class="col-check cell-clicavel" @click="togglePresenca('abertura', linha.titular?.id)">
                            <span v-if="linha.titular" class="marcacao ok">{{ execucao.pres_abertura[linha.titular.id] ? '✓' : '' }}</span>
                        </td>
                        <td class="col-nome">{{ linha.suplente ? `${linha.suplente.nome} (${linha.suplente.partido})` : '' }}</td>
                        <td class="col-check cell-clicavel" @click="togglePresenca('abertura', linha.suplente?.id)">
                            <span v-if="linha.suplente" class="marcacao ok">{{ execucao.pres_abertura[linha.suplente.id] ? '✓' : '' }}</span>
                        </td>
                    </tr>
                </tbody>
            </table>

            <!-- SEÇÃO I - ATAS -->
            <div class="caixa-secao">APROVAÇÃO DE ATAS ANTERIORES</div>
            <p v-if="pauta.aprovacao_atas.atas.length === 0">Não há atas a serem aprovadas.</p>
            <p v-for="ata in pauta.aprovacao_atas.atas" :key="ata.numero" class="item-texto">
                Declaro aprovada a <strong>ata {{ ata.numero }}</strong>, da reunião {{ ata.tipo_reuniao ? ata.tipo_reuniao.toLowerCase() : 'ordinária' }} de {{ formatarDataExtenso(ata.reuniao_referencia) }}, ressalvado aos parlamentares o direito de retificá-la, por escrito.
            </p>

            <!-- SEÇÃO II - EXPEDIENTE -->
            <div class="caixa-secao">LEITURA DO EXPEDIENTE</div>
            
            <div v-if="pauta.leitura_expediente.correspondencias_recebidas.length > 0">
                <strong>COMUNICO CORRESPONDÊNCIA RECEBIDA:</strong><br><br>
                <div v-for="(item, idx) in pauta.leitura_expediente.correspondencias_recebidas" :key="'corr'+idx" class="item-texto">
                    {{ idx + 1 }}. {{ item.remetente ? item.remetente + ':' : '' }} {{ item.mensagem }}
                </div>
            </div>

            <div v-if="pauta.leitura_expediente.proposicoes_recebidas.length > 0" style="margin-top: 15px;">
                <strong>COMUNICO PROPOSIÇÃO RECEBIDA:</strong><br><br>
                <div v-for="(item, idx) in pauta.leitura_expediente.proposicoes_recebidas" :key="'rec'+idx" class="item-texto">
                    {{ idx + 1 }}. <strong>{{ item.tipo }} n.º {{ item.numero }}/{{ item.ano }}</strong><br>
                    Proponente: {{ item.proponente_principal?.nome || item.proponente_cru }}<br>
                    Ementa: {{ item.ementa }} <span v-if="item.votacao_conclusiva" style="text-decoration: underline;">(Tramitação Conclusiva)</span>.<br>
                </div>
                
                <div v-if="pauta.leitura_expediente.proposicoes_recebidas.some(i => i.sujeita_emendas)" style="text-align: center; font-weight: bold; text-transform: uppercase; margin-top: 15px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 15px;">
                    INFORMO PRAZO DE 7 DIAS PARA RECEBIMENTO DE EMENDAS CONFORME REGIMENTO INTERNO.
                </div>
            </div>

            <div v-if="pauta.leitura_expediente.proposicoes_distribuidas.length > 0" style="margin-top: 15px;">
                <strong>COMUNICO PROPOSIÇÕES DISTRIBUÍDAS:</strong><br><br>
                <div v-for="(item, idx) in pauta.leitura_expediente.proposicoes_distribuidas" :key="'pdist'+idx" class="item-texto">
                    {{ idx + 1 }}. <strong>{{ item.tipo }} n.º {{ item.numero }}/{{ item.ano }}</strong><br>
                    Proponente: {{ item.proponente_principal?.nome || item.proponente_cru }}<br>
                    Ementa: {{ item.ementa }}<br>
                    Relator: {{ item.relator?.nome || item.relator_cru || '_________' }}<br>
                    Data de Distribuição: {{ formatarData(item.data_distribuicao) || '_________________' }}
                </div>
            </div>

            <!-- DISTRIBUIÇÃO AUTOMATIZADA -->
            <div v-if="pauta.leitura_expediente.materias_a_distribuir.length > 0" style="margin-top: 15px; page-break-before: auto;">
                <strong>COMUNICO PROPOSIÇÃO PARA DISTRIBUIÇÃO:</strong><br><br>
                <div v-for="(item, idx) in pauta.leitura_expediente.materias_a_distribuir" :key="'dist'+idx" class="item-texto" style="margin-bottom: 40px; border-bottom: 1px dashed #ccc; padding-bottom: 20px;">
                    {{ idx + 1 }}. <strong>{{ item.tipo }} n.º {{ item.numero }}/{{ item.ano }}</strong><br>
                    Proponente: {{ item.proponente_principal?.nome || item.proponente_cru }}<br>
                    Ementa: {{ item.ementa }}<br><br>
                    
                    <div class="distribuicao-container">
                        <!-- Tabela de Titulares Alfabética -->
                        <div class="distribuicao-tabela-box">
                            <table>
                                <thead><tr><th colspan="2">TITULARES (Ordem Alfabética)</th></tr></thead>
                                <tbody>
                                    <tr v-for="dep in titularesApenasOrdemAlfabetica" :key="dep.id" 
                                        :class="{'linha-destaque': execucao.relatores_grade[item.id] === dep.id, 'linha-impedida': item.bancada_impedida && dep.partido === item.bancada_impedida}">
                                        <td>{{ dep.nome }}</td>
                                        <td style="text-align: center;">{{ dep.partido }}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Lógica de Escolha -->
                        <div class="distribuicao-texto-box">
                            <div style="font-weight: bold; margin-bottom: 15px;">ALGUM PARLAMENTAR DESEJA RELATAR A MATÉRIA?</div>
                            
                            <template v-if="execucao.relatores_escolhidos[item.id] && !modoInterativo">
                                <div>HOUVE ACORDO / INTERESSE. RELATOR DESIGNADO:</div>
                                <div style="color: var(--text-instrucao); font-size: 14pt; font-weight: bold; text-transform: uppercase; margin: 10px 0;">
                                    {{ getNomeRelator(execucao.relatores_escolhidos[item.id]) }}
                                </div>
                            </template>
                            <template v-else>
                                <div>NÃO HAVENDO INTERESSADO, OU SEM ACORDO, PELA GRADE O RELATOR SERÁ O DEPUTADO:</div>
                                <div v-if="!modoInterativo" style="color: var(--text-instrucao); font-size: 14pt; font-weight: bold; text-transform: uppercase; margin: 10px 0;">
                                    {{ getNomeRelator(execucao.relatores_grade[item.id]) || '_________________________' }}
                                </div>
                            </template>

                            <!-- Controles do Secretário -->
                            <div v-if="modoInterativo" style="margin: 10px 0; padding: 10px; background: #fff; border: 1px solid #ccc; text-align: left;">
                                <label style="font-size: 9pt; font-weight: bold; color: #666;">Relator pela Grade (Sugerido):</label>
                                <select v-model="execucao.relatores_grade[item.id]" class="select-roteiro">
                                    <option :value="null">-- Selecione a grade --</option>
                                    <option v-for="dep in getTitularesElegiveis(item.bancada_impedida)" :key="'g'+dep.id" :value="dep.id">
                                        {{ dep.nome }} ({{ dep.partido }})
                                    </option>
                                </select>
                                <br><br>
                                <label style="font-size: 9pt; font-weight: bold; color: #2563eb;">Relator Efetivo (Se houver voluntário):</label>
                                <select v-model="execucao.relatores_escolhidos[item.id]" class="select-roteiro">
                                    <option :value="null">-- Seguir a Grade Acima --</option>
                                    <option v-for="dep in getTitularesElegiveis(item.bancada_impedida)" :key="'e'+dep.id" :value="dep.id">
                                        {{ dep.nome }} ({{ dep.partido }})
                                    </option>
                                </select>
                            </div>

                            <div style="font-style: italic; font-size: 9pt; margin-top: 15px;">
                                NÃO PODERÃO SER RELATORES (Art. 61-A)<br>
                                <span style="color: var(--text-instrucao); font-weight: bold;">--- {{ item.bancada_impedida ? '(' + item.bancada_impedida + ')' : 'Nenhuma (Autor Órgão/Externo)' }}</span><br>
                                <span style="font-size: 8pt; display: block; margin-top: 4px;">{{ getListaNomesImpedidos(item.bancada_impedida) }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SEÇÃO III - CONHECIMENTO -->
            <div class="caixa-secao">CONHECIMENTO DE MATÉRIAS DE ALÇADA DA COMISSÃO</div>
            <p v-if="pauta.conhecimento_materias.informativos.length===0 && pauta.conhecimento_materias.audiencias_agendadas.length===0 && pauta.conhecimento_materias.requerimentos_conhecimento.length===0">Nada consta.</p>
            
            <!-- Informativos -->
            <div v-for="(item, idx) in pauta.conhecimento_materias.informativos" :key="'inf'+idx" class="item-texto">
                - {{ item.texto }}
                <div v-if="modoInterativo" style="margin-top: 4px; padding-left: 10px;">
                    <label style="font-size: 9pt; cursor: pointer; color: #2563eb; font-weight: bold;">
                        <input type="checkbox" v-model="execucao.flags_info[idx]"> Requer deliberação (De acordo)
                    </label>
                </div>
                <div v-if="execucao.flags_info[idx]" style="text-align: center; font-weight: bold; margin-top: 10px;">
                    OS PARLAMENTARES CONCORDAM? 
                    ( <span class="marcacao-x" @click="modoInterativo && (execucao.res_info[idx] = !execucao.res_info[idx])">{{ execucao.res_info[idx] ? 'X' : '&nbsp;&nbsp;' }}</span> ) APROVADO.
                </div>
            </div>

            <!-- Deliberativos Administrativos -->
            <div v-for="(item, idx) in pauta.conhecimento_materias.deliberativos_administrativos" :key="'deladm'+idx" class="item-texto">
                - {{ item.texto }}
                <div v-if="modoInterativo" style="margin-top: 4px; padding-left: 10px;">
                    <label style="font-size: 9pt; cursor: pointer; color: #2563eb; font-weight: bold;">
                        <input type="checkbox" v-model="execucao.flags_delib[idx]"> Requer deliberação (De acordo)
                    </label>
                </div>
                <div v-if="execucao.flags_delib[idx]" style="text-align: center; font-weight: bold; margin-top: 10px;">
                    OS PARLAMENTARES CONCORDAM? 
                    ( <span class="marcacao-x" @click="modoInterativo && (execucao.res_delib[idx] = !execucao.res_delib[idx])">{{ execucao.res_delib[idx] ? 'X' : '&nbsp;&nbsp;' }}</span> ) APROVADO.
                </div>
            </div>
            
            <div v-if="pauta.conhecimento_materias.audiencias_agendadas.length > 0" style="margin-top: 15px;">
                <div v-for="(aud, idx) in pauta.conhecimento_materias.audiencias_agendadas" :key="'aud'+idx" class="item-texto">
                    - <strong>Audiência Pública Agendada:</strong><br>
                    Data: {{ formatarData(aud.data) }} {{ aud.hora ? ' – ' + aud.hora : '' }}<br>
                    Local: {{ aud.local }}<br>
                    Proponente: {{ aud.proponente?.nome || aud.proponente_cru }}<br>
                    Pauta: {{ aud.pauta }}
                </div>
            </div>

            <div v-if="pauta.conhecimento_materias.requerimentos_conhecimento.length > 0" style="margin-top: 15px;">
                <div style="font-weight: bold;">Requerimentos para conhecimento:</div>
                <div v-for="(req, idx) in pauta.conhecimento_materias.requerimentos_conhecimento" :key="'req'+idx" class="item-texto">

  return { id:null, tipo:null, numero:null, ano:null, ementa:'', ordem:null, proponente_principal:null, proponente_cru: null, relator_cru: null, coautores_adicionais:0, votacao_conclusiva:false, relator:null, parecer:null, pareceres_anteriores:[], maioria_simples:false, bancada_impedida:null, eleicao:false, permite_pedido_vista:true, local:null, modalidade:null, convidados:[], sujeita_emendas:false, sugestao_relatoria:null, data_distribuicao:null };
}

const MARCADORES = [
  {chave:'atas',            rx:/^\s*(?:I\s*[-–—]\s*)?APROVA[ÇC][ÃA]O\s+DA/im},
  {chave:'expediente',      rx:/^\s*(?:II\s*[-–—]\s*)?LEITURA\s+DO\s+EXPEDIENTE/im},
  {chave:'conhecimento',    rx:/^\s*(?:III\s*[-–—]\s*)?CONHECIMENTO\s+DE\s+MAT[ÉE]RIA/im},
  {chave:'ordem_do_dia',    rx:/^\s*(?:IV\s*[-–—]\s*)?ORDEM\s+DO\s+DIA/im},
  {chave:'assuntos_gerais', rx:/^\s*(?:V\s*[-–—]\s*)?ASSUNTOS\s+GERAIS/im},
  {chave:'rodape',          rx:/^\s*Pal[áa]cio\s+Farroupilha/im},
];

function fatiar(texto){
  const pos = [];
  MARCADORES.forEach(m => {
    const mt = texto.match(m.rx);
    if(mt) pos.push({chave:m.chave, i:mt.index});
  });
  pos.sort((a,b) => a.i - b.i);
  const fatias = {};
  if(pos.length && pos[0].i > 0) fatias.cabecalho = texto.slice(0, pos[0].i);
  pos.forEach((p, k) => {
    const fim = (k+1 < pos.length) ? pos[k+1].i : texto.length;
    fatias[p.chave] = texto.slice(p.i, fim);
  });
  if(!pos.length) fatias.cabecalho = texto;
  return fatias;
}

function dataISO(txt){
  if(!txt) return null;
  let m = txt.match(/(\d{4})-(\d{2})-(\d{2})/);
  if(m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = txt.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  const MESES = {janeiro:'01',fevereiro:'02',março:'03',marco:'03',abril:'04',maio:'05',junho:'06',julho:'07',agosto:'08',setembro:'09',outubro:'10',novembro:'11',dezembro:'12'};
  m = txt.match(/(\d{1,2})\s+de\s+([a-zçã]+)\s+de\s+(\d{4})/i);
  if(m){ const mes = MESES[normNome(m[2])]; if(mes) return `${m[3]}-${mes}-${String(m[1]).padStart(2,'0')}`; }
  m = txt.match(/(\d{1,2})\s*\/\s*([a-zçã]{3,})\s*\/\s*(\d{4})/i);
  if(m){ const mes = MESES[normNome(m[2])]; if(mes) return `${m[3]}-${mes}-${String(m[1]).padStart(2,'0')}`; }
  return null;
}

function horaHHMM(txt){
  if(!txt) return null;
  const m = txt.match(/(\d{1,2})\s*[:hH]\s*(\d{2})/);
  return m ? `${String(m[1]).padStart(2,'0')}:${m[2]}` : null;
}

function sentidoParecer(txt){
  if(!txt) return null;
  const t = normNome(txt);
  if(/com\s+emenda/.test(t)) return 'favoravel_com_emendas';
  if(/contrari/.test(t)) return 'contrario';
  if(/favorav/.test(t)) return 'favoravel';
  return null;
}

function limparConclusivaDaEmenta(ementa){
  if(!ementa) return ementa;
  return ementa.replace(/\s*\((?:\s*em\s+)?(?:tramita[çc][ãa]o|vota[çc][ãa]o)\s+conclusiva[^)]*\)\s*/gi,' ')
    .replace(/\s*[,;–—-]?\s*(?:em\s+)?(?:tramita[çc][ãa]o|vota[çc][ãa]o)\s+conclusiva(?:\s+(?:nesta|na)\s+comiss[ãa]o)?\s*\.?/gi,' ')
    .replace(/\s+/g,' ').replace(/\s+([.,;])/g,'$1').replace(/[,;]\s*$/,'').trim().replace(/([^.)])$/,'$1.');
}

function siglaDoTipo(extenso){
  const t = (extenso || '').trim();
  for(const e of TIPOS_EXTENSO){ if(e.rx.test(t)) return e.sigla; }
  return null;
}

function resolverNome(cru) {
  if (!cru || !cru.trim()) return null;
  const t = cru.trim();
  const limpo = t.replace(/^Deputad[oa]\s*(?:\(a\))?\s*/i, '').replace(/^Dep\.\s*/i, '').trim();
  const nomeBusca = limpo.split('+')[0].trim(); 

  const deps = DEPUTADOS_DATA.deputados;
  
  for (const d of deps) {
    if (d.nome.toLowerCase() === nomeBusca.toLowerCase()) {
      return { id: d.id_assembleia, nome: d.nome, partido: d.partido };
    }
  }
  const words = nomeBusca.split(/\s+/);
  if (words.length >= 2) {
    const sobrenome = words[words.length - 1].toLowerCase();
    for (const d of deps) {
      const dWords = d.nome.split(/\s+/);
      if (dWords[dWords.length - 1].toLowerCase() === sobrenome) {
        return { id: d.id_assembleia, nome: d.nome, partido: d.partido };
      }
    }
  }
  for (const d of deps) {
      if (normNome(d.nome).includes(normNome(nomeBusca))) {
          return { id: d.id_assembleia, nome: d.nome, partido: d.partido };
      }
  }
  return null;
}

function extrairBlocos(txt, faseBGlobal){
  if(!txt) return [];
  const RX_ITEM = /^[ \t]*(\d+)\s*[).]\s*(.+?)\s+n\.?\s*[º°]?\s*(\d+)\s*\/\s*(\d{4})/gim;
  const achados = []; let m; RX_ITEM.lastIndex = 0;
  while((m = RX_ITEM.exec(txt)) !== null){
    const sigla = siglaDoTipo(m[2]);
    if(!sigla) continue;
    achados.push({ tipo: sigla, tipoExtenso: m[2].trim(), numero: parseInt(m[3], 10), ano: parseInt(m[4], 10), inicio: m.index });
  }
  achados.forEach((a, i) => {
    a.corpo = txt.slice(a.inicio, i+1 < achados.length ? achados[i+1].inicio : txt.length);
    const antes = txt.slice(0, a.inicio);
    const souPL = (a.tipo === 'PL' || a.tipo === 'PLC');
    a.faseB = souPL && (!!faseBGlobal || /[-•]\s*Vota[çc][ãa]o\s+Conclusiva\s*:/i.test(antes));
  });
  return achados;
}

function parsearProposicao(bloco, ctx){
  const it = itemVazio();
  it.tipo = bloco.tipo; it.numero = bloco.numero; it.ano = bloco.ano;
  it.id = `${String(bloco.tipo).toLowerCase()}-${String(bloco.numero).padStart(4,'0')}-${bloco.ano}`;
  const corpo = bloco.corpo || '';

  const mProp = corpo.match(/(?:Proponente|Autor(?:ia)?)\s*:\s*([^\n]+)/i);
  if(mProp){
    let cru = mProp[1].trim();
    const mCo = cru.match(/\+\s*(\d+)\s*(?:Deputad|outros?|coautor)/i);
    if(mCo){ it.coautores_adicionais = parseInt(mCo[1], 10); cru = cru.split('+')[0].trim(); }
    it.proponente_cru = cru;
    it.proponente_principal = resolverNome(cru);
  }

  const mEm = corpo.match(/(?:Ementa|Assunto)\s*:\s*([\s\S]*?)(?=\n\s*(?:Relator|Parecer|Convidados?|Local|Publicad|Data\s+de\s+Distribui|Proponente|Pauta)\b|$)/i);
  if(mEm) it.ementa = mEm[1].replace(/\s*\n\s*/g,' ').trim();

  const ehPL = (it.tipo === 'PL' || it.tipo === 'PLC');
  const RX_CONCLUSIVA = /(?:tramita[çc][ãa]o|vota[çc][ãa]o)\s+conclusiva|conclusiv[ao]\s+(?:nesta|na)\s+comiss/i;
  if(bloco.faseB && ehPL) it.votacao_conclusiva = true;
  if(RX_CONCLUSIVA.test(it.ementa)){
    if(ehPL) it.votacao_conclusiva = true;
    it.ementa = limparConclusivaDaEmenta(it.ementa);
  }

  if(it.tipo === 'REQ'){
    const e = normNome(it.ementa);
    if(/cria[çc]?[ãa]?o?\s+de\s+(?:uma\s+)?subcomiss/.test(e)) it.tipo = 'REQSUB';
    else if(/relatorio\s+final\s+d[ae]\s+subcomiss/.test(e)) it.tipo = 'RELSUB';
    else if(/elei[çc][ãa]o\s+d[eo]/.test(e)){ it.eleicao = true; it.maioria_simples = false; }
    else if(/convit|convidar/.test(e)) it.maioria_simples = true;
  }

  const relatoresPossiveis = [];
  const rxRel = /(?:^|\n)([ \t]*(?:Comiss[ãa]o[^\n]*\n)?)[ \t]*Relator(?:\s*\(a\))?\s*:\s*([^\n]+)/gi;
  let mR;
  while((mR = rxRel.exec(corpo)) !== null){
    if(!/Comiss[ãa]o/i.test(mR[1] || '')) relatoresPossiveis.push(mR[2].trim());
  }
  if(relatoresPossiveis.length){
    const cru = relatoresPossiveis[0].trim();
    it.relator_cru = cru;
    if(bloco.faseB) it.sugestao_relatoria = resolverNome(cru);
    else it.relator = resolverNome(cru);
  }

  const mPar = corpo.match(/Parecer\s*:\s*([^\n]+)(?!\n+[ \t]*Comiss[ãa]o)/i);
  const ehHistorico = mPar && /\n+[ \t]*Comiss[ãa]o/i.test(corpo.slice(corpo.indexOf(mPar[0]) + mPar[0].length, corpo.indexOf(mPar[0]) + mPar[0].length + 80));
  if(mPar && !ehHistorico && !bloco.faseB) it.parecer = sentidoParecer(mPar[1]);

  const mDD = corpo.match(/Data\s+de\s+Distribui[çc][ãa]o\s*:?\s*([^\n]+)/i);
  if(mDD) it.data_distribuicao = dataISO(mDD[1]);

  const rxParAnt = /^[ \t]*Parecer\s*:\s*([^\n]+)\n+[ \t]*(Comiss[ãa]o[^\n]+)\n+[ \t]*Relator(?:\s*\(a\))?\s*:\s*([^\n]+)/gim;
  let mPA;
  while((mPA = rxParAnt.exec(corpo)) !== null){
    it.pareceres_anteriores.push({ comissao: mPA[2].trim(), relator: limparNome(mPA[3]), parecer: sentidoParecer(mPA[1]) });
  }

  if(it.tipo === 'RAP'){
    const mLocal = corpo.match(/Local\s*:\s*([^\n]+)/i);
    if(mLocal) it.local = mLocal[1].trim();
    
    const mConv = corpo.match(/Convidados?\s*:\s*([\s\S]*?)(?=\n\s*(?:Relator|Parecer|Local|Data|Proponente)\b|$)/i);
    if(mConv){
      it.convidados = mConv[1].replace(/\s*\n\s*/g,' ').split(';').map(s => s.trim().replace(/\.$/,'')).filter(Boolean);
    }
  }

  if(bloco.faseB || ['RAP','REQ','REQSUB','RELSUB','RDI'].indexOf(it.tipo) >= 0) it.permite_pedido_vista = false;
  if(it.proponente_principal && it.proponente_principal.partido) it.bancada_impedida = it.proponente_principal.partido;
  
  it._fase_b = !!bloco.faseB;
  return it;
}

const { createApp, ref, reactive, computed, watch, onMounted } = Vue;

const STORAGE_KEY = 'roteiro_inteligente_autosave';

createApp({
    setup() {
        const textoAgenda = ref('');
        const pautaProcessada = ref(false);
        const modoInterativo = ref(false);
        
        const pauta = reactive(pautaVazia());

            pres_abertura: {}, pres_deliberacao: {}, status_quorum: null,

            flags_info: {}, flags_delib: {},

        function salvarEstado() {
            if(!pautaProcessada.value) return;
            const estado = { textoAgenda: textoAgenda.value, pautaProcessada: pautaProcessada.value, pauta: pauta, execucao: execucao };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(estado));

            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const arrayBuffer = e.target.result;
                
                // Mammoth extrai apenas o texto puro do .docx
                mammoth.extractRawText({ arrayBuffer: arrayBuffer })
                    .then(function(result) {
                        textoAgenda.value = result.value; // Joga na caixa de texto
                        processarAgenda();                // Dispara o processamento automático
                        event.target.value = '';          // Limpa o input de arquivo
                    })
                    .catch(function(err) {
                        alert("Erro ao ler o arquivo DOCX: " + err.message);
                    });
            };
            reader.readAsArrayBuffer(file);
        }

        watch([textoAgenda, pautaProcessada, pauta, execucao], () => { salvarEstado(); }, { deep: true });

        function formatarDataExtenso(strData) {

            if (p.length !== 3) return strData;
            const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
            return `${parseInt(p[2])} de ${meses[parseInt(p[1])-1]} de ${p[0]}`;
        }

        function formatarParecer(parecer) {
            if (!parecer) return '_________';
            if (parecer === 'favoravel') return 'Favorável';
            if (parecer === 'favoravel_com_emendas') return 'Favorável com emendas';
            return 'Contrário';
        }
        
        function formatarStringEmenda(num) {
            if (!num || num === 0) return '';
            if (num === 1) return '+ A EMENDA';
            return '+ AS EMENDAS';
        }

        function ehFaseB(it){ return !!it._fase_b || (it.votacao_conclusiva && !it.relator && !it.parecer); }

        function imprimir() { modoInterativo.value = false; setTimeout(() => window.print(), 300); }

        function copiarResumo() {
            let txt = `RESUMO DA REUNIÃO - ${pauta.metadados.sigla || 'COMISSÃO'}\nData: ${formatarData(pauta.metadados.data)}\n\n`;
            let presTotais = Object.values(execucao.pres_abertura).filter(Boolean).length;
            txt += `Quórum de Abertura: ${presTotais} presentes.\n\n`;
            
            if (pauta.ordem_do_dia.length > 0) {
                txt += `ORDEM DO DIA:\n`;
                pauta.ordem_do_dia.forEach((item, i) => {
                    let res = execucao.resultado_votacao[item.id];
                    let status = res === 'aprovado' ? 'APROVADO' : (res === 'rejeitado' ? 'REJEITADO' : 'NÃO VOTADO');
                    let f = totalVotos(item.id, 'F') || '0';
                    let c = totalVotos(item.id, 'C') || '0';
                    txt += `${i+1}) ${item.tipo} ${item.numero}/${item.ano} - ${status} (Favor: ${f}, Contra: ${c})\n`;
                });
            }
            if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => alert('Resumo copiado!'));
            else alert("Erro ao copiar.");
        }

        function processarAgenda() {
            const txt = textoAgenda.value;
            if (!txt) return;

            Object.assign(pauta, pautaVazia());
            execucao.pres_abertura = {}; execucao.pres_deliberacao = {}; execucao.status_quorum = null; 
            execucao.relatores_grade = {}; execucao.relatores_escolhidos = {}; 
            execucao.votos = {}; execucao.resultado_votacao = {}; execucao.historico = {};
            execucao.votos_emendas = {}; execucao.resultado_emendas = {}; 
            execucao.flags_info = {}; execucao.flags_delib = {}; execucao.res_info = {}; execucao.res_delib = {}; 
            execucao.eleitos = {};

            const fatias = fatiar(txt);

            if (fatias.cabecalho) {
                const mCom = fatias.cabecalho.match(/COMISS[ÃA]O\s+DE\s+([^\n]+)/i);
                if (mCom) pauta.metadados.comissao = ('Comissão de ' + mCom[1].trim()).replace(/\s+/g,' ');
                const mSigla = fatias.cabecalho.match(/\b(CEDST|CAPPC|CAM|CCDH|CCJ|CECDCT|CFPFC|CSMA|CSSP|CMPDCCPLP|CMAI)\b/i);
                if(mSigla) pauta.metadados.sigla = mSigla[1].toUpperCase();
                else if (pauta.metadados.comissao) {
                    const nomeBuscado = normNome(pauta.metadados.comissao);
                    const comEncontrada = COMISSOES_DATA.comissoes.find(c => normNome(c.nome) === nomeBuscado);
                    if (comEncontrada) { pauta.metadados.sigla = comEncontrada.sigla; pauta.metadados.comissao = comEncontrada.nome; }
                }
				const mDH = fatias.cabecalho.match(/Data\s+e\s+Hora\s*:\s*([^\n]+)/i);
                pauta.metadados.data = dataISO(mDH ? mDH[1] : txt); pauta.metadados.hora_inicio = horaHHMM(mDH ? mDH[1] : txt);
                const mLoc = fatias.cabecalho.match(/Local\s*:\s*([^\n-]+)/i); if (mLoc) pauta.metadados.local = mLoc[1].trim();
                const mMod = fatias.cabecalho.match(/H[íi]brida|Presencial|Virtual/i); if(mMod) pauta.metadados.modalidade = mMod[0];
                const mTipo = fatias.cabecalho.match(/Reuni[ãa]o\s+(Ordin[áa]ria|Extraordin[áa]ria)/i);
                if (mTipo) pauta.metadados.tipo_reuniao = normNome(mTipo[1]).startsWith('ordin') ? 'Ordinária' : 'Extraordinária';
            }

            pauta.metadados.tipo_reuniao = pauta.metadados.tipo_reuniao || 'Ordinária';
            pauta.metadados.sigla = pauta.metadados.sigla || 'COMISSÃO'; pauta.metadados.comissao = pauta.metadados.comissao || 'COMISSÃO';

            if (fatias.atas) {
                fatias.atas.split('\n').forEach(linha => {
                    const m = linha.match(/Ata\s*n\.?\s*[º°]?\s*(\d+)\s*\/\s*(\d{4})\s*,?\s*(?:d[ao]\s+)?([^\n]*)/i);
                    if(!m) return;
                    let tipo = null;
                    if(/audi[êe]ncia\s+p[úu]blica/i.test(m[3])) tipo = 'Audiência Pública'; else if(/reuni[ãa]o\s+ordin/i.test(m[3])) tipo = 'Reunião Ordinária'; else if(/reuni[ãa]o\s+extra/i.test(m[3])) tipo = 'Reunião Extraordinária';
                    pauta.aprovacao_atas.atas.push({ numero: `${m[1]}/${m[2]}`, reuniao_referencia: dataISO(m[3]) || m[3], tipo_reuniao: tipo });
                });
            }

            if (fatias.expediente) {
                const txtExp = fatias.expediente;
                const alinea = (rx) => { const m = txtExp.match(rx); if(!m) return ''; const resto = txtExp.slice(m.index + m[0].length); const prox = resto.search(/^[ \t]*[a-z]\)\s/m); return resto.slice(0, prox >= 0 ? prox : resto.length); };
                const tCorr = alinea(/^[ \t]*a\)\s*Correspond[êe]ncias?[^\n]*/im);
                if(tCorr) { tCorr.split('\n').forEach(linha => { const l = linha.trim(); if(!l || !/^\d+\s*[.)]/.test(l)) return; const corpo = l.replace(/^\d+\s*[.)]\s*/,'').trim(); const i = corpo.indexOf(':'); pauta.leitura_expediente.correspondencias_recebidas.push({ remetente: i > 0 ? corpo.slice(0, i).trim() : null, mensagem:  i > 0 ? corpo.slice(i+1).trim() : corpo }); }); }
                const tRec = alinea(/^[ \t]*b\)\s*Proposi[çc][õo]es\s+Recebidas[^\n]*/im);
                if(tRec) { const posEmendas = tRec.search(/[-•]\s*Sujeitas?\s+a\s+emendas/i); extrairBlocos(tRec).forEach(b => { const it = parsearProposicao(b, 'recebida'); if(posEmendas >= 0 && b.inicio > posEmendas) it.sujeita_emendas = true; pauta.leitura_expediente.proposicoes_recebidas.push(it); }); }
                const tDist = alinea(/^[ \t]*c\)\s*Proposi[çc][õo]es\s+Distribu[íi]das[^\n]*/im);
                if(tDist) extrairBlocos(tDist).forEach(b => pauta.leitura_expediente.proposicoes_distribuidas.push(parsearProposicao(b, 'distribuida')));
                const tADist = alinea(/^[ \t]*d\)\s*Mat[ée]rias?[^\n]*/im);
                if(tADist) extrairBlocos(tADist).forEach(b => pauta.leitura_expediente.materias_a_distribuir.push(parsearProposicao(b, 'a_distribuir')));
            }

            if (fatias.conhecimento) {
                const txtConh = fatias.conhecimento; const c = pauta.conhecimento_materias;
                const iAud = txtConh.search(/^\s*\d+\.\s*Audi[êe]ncias?\s+P[úu]blicas?\s+agendadas/im);
                const iReq = txtConh.search(/^[ \t]*[-•]\s*Requerimentos?\s+para\s+conhecimento/im);
                const fimNumerados = Math.min(iAud >= 0 ? iAud : Infinity, iReq >= 0 ? iReq : Infinity, txtConh.length);
                const mTitulo = txtConh.match(/^[\s\S]*?CONHECIMENTO\s+DE\s+MAT[ÉE]RIA[^\n]*\n/im);
                const corpoNum = txtConh.slice(mTitulo ? mTitulo[0].length : 0, fimNumerados);

                corpoNum.split(/\n(?=[ \t]*\d+\.\s)/).forEach(p => {
                    if(!/^\s*\d+\.\s/.test(p)) return;
                    const t = p.replace(/^\s*\d+\.\s*/,'').replace(/\s*\n\s*/g,' ').trim();
                    if(t.length < 8) return;
                    if(/^autoriza[çc][ãa]o|autoriza[çc][ãa]o\s+para|solicita\s+autoriza|aprova[çc][ãa]o\s+d[eo]/i.test(t)){ c.deliberativos_administrativos.push({texto:t, requer_deliberacao:true}); } else { c.informativos.push({texto:t}); }
                });

                if(iAud >= 0) {
                    const fimAud = (iReq >= 0 && iReq > iAud) ? iReq : txtConh.length;
                    const bloco = txtConh.slice(iAud, fimAud);
                    bloco.split(/\n(?=[ \t]*Data\s*:)/i).forEach(b => {
                        if(!/^\s*Data\s*:/i.test(b)) return;
                        const g = (rx) => { const m = b.match(rx); return m ? m[1].trim().replace(/\.$/,'') : null; };
                        const dataCrua = g(/Data\s*:\s*([^\n]+)/i);
                        c.audiencias_agendadas.push({ data: dataISO(dataCrua || ''), hora: horaHHMM(dataCrua || ''), local: g(/Local\s*:\s*([^\n]+)/i), proponente_cru: g(/Proponente\s*:\s*([^\n]+)/i), proponente: resolverNome(g(/Proponente\s*:\s*([^\n]+)/i)), pauta: g(/Pauta\s*:\s*([^\n]+)/i) });
                    });
                }

                if(iReq >= 0) {
                    const bloco = txtConh.slice(iReq);
                    extrairBlocos(bloco).forEach(b => {
                        const resto = b.corpo.replace(/^[ \t]*\d+\s*[).]\s*.+?n\.?\s*[º°]?\s*\d+\s*\/\s*\d{4}\s*[-–—]?\s*/i,'');
                        const mOrigem = resto.replace(/\s*\n\s*/g,' ').trim().match(/\(([^)]+)\)\s*$/);
                        c.requerimentos_conhecimento.push({ tipo: b.tipo, numero: b.numero, ano: b.ano, id: `${b.tipo.toLowerCase()}-${String(b.numero).padStart(4,'0')}-${b.ano}`, texto: resto.replace(/\s*\n\s*/g,' ').trim(), origem: mOrigem ? mOrigem[1].trim() : null });
                    });
                }
            }

            if (fatias.ordem_do_dia) {
                let ordem = 1;
                extrairBlocos(fatias.ordem_do_dia).forEach(b => {
                    const it = parsearProposicao(b, 'od'); it.ordem = ordem++;
                    execucao.historico[it.id] = { is_relatorio_lido: false, relatorio_lido_data: '', vistas_anteriores: [], demais_integrantes: '', num_emendas: 0 };
                    pauta.ordem_do_dia.push(it);
                });
            }

            if (fatias.assuntos_gerais) {
                const txtAG = fatias.assuntos_gerais;
                const mT = txtAG.match(/^[\s\S]*?ASSUNTOS\s+GERAIS[^\n]*\n/im);
                const corpo = txtAG.slice(mT ? mT[0].length : 0);
                corpo.split(/\n(?=[ \t]*\d+\.\s)/).forEach(p => {
                    if(!/^\s*\d+\.\s/.test(p)) return; const t = p.replace(/^\s*\d+\.\s*/,'').replace(/\s*\n\s*/g,' ').trim();
                    if(t.length > 8) pauta.assuntos_gerais.itens.push({texto: t});
                });
                const mProx = txtAG.match(/pr[óo]xima\s+reuni[ãa]o[^\n]*/i); if(mProx) pauta.assuntos_gerais.proxima_reuniao = dataISO(mProx[0]);
            }

            pautaProcessada.value = true;
        }

        return {
            textoAgenda, pautaProcessada, modoInterativo, pauta, execucao,
            comissaoAtual, nomeComissaoMinusc, quorumMinimoAbertura, quorumMinimoDeliberacao, tabelaMembros, nomePresidenteComissao,
            titularesApenasOrdemAlfabetica, bancadasComissao, textoAberturaDinamico, listaCalendarios, ehFaseB,
            processarAgenda, limparTudo, copiarResumo, togglePresenca, registrarVoto, registrarVotoEmenda, registrarResultado, registrarResultadoEmenda, getVoto, getVotoEmenda, totalVotos,
            getTitularesElegiveis, getNomeRelator, getListaNomesImpedidos, formatarData, formatarDataExtenso, formatarParecer, formatarStringEmenda, imprimir, lerDocx
        };
    }
}).mount('#app');
</script>

</html>
