<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roteiro da Presidência - ALRS</title>
<!-- Vue.js 3 via CDN -->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<!-- Supabase JS v2 via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root { --bg-app: #cbd5e1; --doc-bg: #ffffff; --text-main: #000000; --text-instrucao: #C00000; --border-color: #000000; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: var(--bg-app); font-family: Arial, Helvetica, sans-serif; color: var(--text-main); line-height: 1.4; }

/* BARRA DE SELEÇÃO DO PRESIDENTE */
#barra-presidente {
    background: #1e293b; color: white; padding: 12px 20px; position: sticky; top: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
.seletores-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1; }
.seletores-box label { font-size: 12px; font-weight: bold; color: #94a3b8; }
.seletores-box select { padding: 8px 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; font-weight: bold; cursor: pointer; }
.acoes-box { display: flex; gap: 8px; }
button { padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; text-transform: uppercase; transition: 0.15s; }
.btn-refresh { background: #3b82f6; color: white; } .btn-refresh:hover { background: #2563eb; }
.btn-print { background: #10b981; color: white; } .btn-print:hover { background: #059669; }

/* Preferências de interface: independentes dos dados da reunião. */
.area-documento { min-width: 0; flex: 1; }
.painel-comandos { position: sticky; top: 0; z-index: 100; background: #1e293b; color: #f8fafc; box-shadow: 0 3px 8px #0002; }
.cabecalho-painel { display: flex; align-items: center; min-height: 38px; background: #0f172a; }
.layout-tools { display: flex; gap: 4px; align-items: center; padding: 4px 8px; flex-shrink: 0; }
.btn-layout { display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-width: 30px; min-height: 30px; padding: 5px 7px; background: #334155; color: #e2e8f0; border: 1px solid #475569; border-radius: 4px; font-size: 11px; text-transform: none; white-space: nowrap; cursor: pointer; }
.btn-layout:hover { background: #475569; }
.btn-layout:focus-visible, .painel-comandos select:focus-visible, .painel-comandos button:focus-visible { outline: 2px solid #7dd3fc; outline-offset: 2px; }
.aviso-layout { font-size: 11px; color: #fcd34d; padding: 4px 8px; }
.campo-barra { display: flex; align-items: center; gap: 6px; white-space: nowrap; min-width: 0; }
.campo-barra label { flex-shrink: 0; }
.campo-barra select { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
@media screen {
    .area-documento > .folha-a4 { max-width: calc(100% - 24px); }
    .area-documento > .config-panel { max-width: min(1100px, calc(100% - 24px)); overflow-x: auto; }
}
@media screen and (min-width: 960px) {
    .app-layout.layout-lateral { display: flex; align-items: flex-start; }
    .layout-lateral > .painel-comandos { width: var(--largura-painel); flex: 0 0 var(--largura-painel); height: 100vh; overflow-y: auto; overflow-x: hidden; }
    .layout-lateral .cabecalho-painel { flex-direction: column; align-items: stretch; }
    .layout-lateral .layout-tools { flex-wrap: wrap; justify-content: center; order: 0; }
    .layout-lateral .campo-barra { width: 100%; flex: none; flex-direction: column; align-items: stretch; gap: 4px; }
    .layout-lateral .campo-barra select { width: 100%; max-width: 100%; }
    .layout-lateral.painel-recolhido > .painel-comandos { width: 38px; flex-basis: 38px; }
    .layout-lateral.painel-recolhido .layout-tools { padding: 4px; flex-direction: column; }
    .layout-lateral.painel-recolhido .rotulo-layout { display: none; }
    .layout-lateral.painel-recolhido .btn-layout { width: 30px; padding: 4px; }
}
@media screen and (max-width: 959px) {
    .painel-comandos { max-height: 65vh; overflow-y: auto; }
}
@media print {
    #app, .app-layout, .area-documento { display: block !important; width: auto !important; min-width: 0 !important; padding: 0 !important; overflow: visible !important; }
    .painel-comandos { display: none !important; }
}
.app-layout { --largura-painel: 280px; }
#barra-presidente { position: static; padding: 6px 8px; display: flex; align-items: center; flex-wrap: wrap; gap: 8px; box-shadow: none; }
#barra-presidente label { font-size: 10px; font-weight: bold; color: #94a3b8; }
#barra-presidente select { padding: 6px; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 12px; cursor: pointer; }
#barra-presidente .campo-comissao { flex: 1 1 220px; }
#barra-presidente .campo-comissao select { width: 100%; max-width: 320px; }
#barra-presidente .campo-reuniao { flex: 1 1 210px; }
#barra-presidente .campo-reuniao select { width: 100%; }
#barra-presidente .campo-modo { flex: 0 1 220px; }
#barra-presidente .campo-modo select { width: 100%; }
#barra-presidente .status-conducao { font-size: 11px; padding: 4px 6px; white-space: nowrap; }
#barra-presidente .acoes-box { flex-shrink: 0; gap: 4px; }
#barra-presidente button { font-size: 10px; text-transform: none; padding: 7px 8px; white-space: nowrap; }
.status-local { font-size: 11px; }
.erro-barra { font-size: 11px; color: #fde68a; flex-basis: 100%; white-space: normal; }
.app-presidente > .painel-comandos { display: flex; align-items: center; }
.app-presidente .layout-tools { order: 2; padding: 4px; }
.app-presidente .rotulo-layout { display: none; }
.app-presidente #barra-presidente { flex: 1; min-width: 0; }
@media screen and (min-width: 1280px) {
    .layout-topo #barra-presidente { flex-wrap: nowrap; }
    .layout-topo #barra-presidente .campo-comissao { min-width: 160px; }
    .layout-topo #barra-presidente .campo-reuniao { min-width: 175px; }
    .layout-topo #barra-presidente .campo-modo { min-width: 165px; }
}
@media screen and (min-width: 960px) {
    .app-presidente.layout-lateral > .painel-comandos { display: block; }
    .app-presidente.layout-lateral .rotulo-layout { display: inline; }
    .layout-lateral #barra-presidente { flex-direction: column; align-items: stretch; padding: 12px; gap: 16px; }
    .layout-lateral #barra-presidente .campo-barra { flex: none; }
    .layout-lateral #barra-presidente .acoes-box { display: grid; grid-template-columns: 1fr 1fr; }
    .app-presidente.layout-lateral.painel-recolhido .rotulo-layout { display: none; }
}
@media screen and (max-width: 599px) {
    #barra-presidente .campo-barra { flex: 1 1 100%; }
    .app-presidente > .painel-comandos { align-items: flex-start; }
}

/* A FOLHA A4 */
.folha-a4 { background: var(--doc-bg); width: 210mm; min-height: 297mm; margin: 25px auto; padding: 18mm 15mm; box-shadow: 0 10px 25px rgba(0,0,0,0.15); font-size: 11pt; line-height: 1.48; }
h3, h4 { text-align: center; margin-bottom: 5px; }
.cabecalho-doc { padding-bottom: 10px; margin-bottom: 10px; }
.titulo-roteiro { border-top: 2px solid var(--border-color); border-bottom: 2px solid var(--border-color); padding: 8px; text-align: center; font-weight: bold; margin-bottom: 16px; text-transform: uppercase; }
.instrucao { color: var(--text-instrucao); font-style: italic; font-weight: bold; text-align: center; margin: 14px 0; line-height: 1.45; }
.item-texto { margin-bottom: 12px; text-align: justify; line-height: 1.48; }
.item-destaque { background: #e2e2e2; padding: 5px 8px; font-weight: bold; font-size: 12pt; border: 1px solid var(--border-color); margin-bottom: 10px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.item-ordem-dia { margin-bottom: 35px; page-break-inside: avoid; border-bottom: 1px dotted #ccc; padding-bottom: 20px; }

.caixa-secao { border: 2px solid var(--border-color); background-color: #e2e2e2; text-align: center; font-weight: bold; text-transform: uppercase; padding: 6px; margin: 26px 0 14px 0; font-size: 12pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

/* Tabelas do Roteiro */
table.tabela-roteiro { width: 100%; border-collapse: collapse; margin: 12px 0; page-break-inside: avoid; }
table.tabela-roteiro th, table.tabela-roteiro td { border: 1px solid var(--border-color); padding: 5px 6px; text-align: left; vertical-align: middle; }
table.tabela-roteiro th { background-color: #f1f1f1; font-weight: bold; text-align: center; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
table.tabela-roteiro.tabela-membros { table-layout: fixed; }
table.tabela-roteiro .col-check { width: 26px; padding: 4px 2px; text-align: center !important; font-weight: bold; }
table.tabela-roteiro .col-nome { font-size: 9.5pt; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 4px 6px; }
.abertura-orientacoes > p { margin-top: 8px; line-height: 1.45; }
.abertura-orientacoes .abertura-nota { font-size: 10pt; color: #000; font-weight: normal; }
.abertura-orientacoes .abertura-artigo { margin-top: 10px; padding: 6px 10px; }
.abertura-declaracao { margin-top: 16px; text-align: center; font-size: 11.5pt; line-height: 1.5; font-weight: bold; }
.abertura-data { font-size: 13pt; margin-top: 8px; }
.item-ordem-dia .linha-item { margin-bottom: 4px; }
.item-ordem-dia .instrucao { margin: 14px 0 !important; line-height: 1.45; }

.tabela-vista { width: auto; margin: 10px auto; border-collapse: collapse; font-size: 10pt; }
.tabela-vista th, .tabela-vista td { border: 1px solid #000; padding: 4px 10px; text-align: center; font-weight: bold; }
.tabela-vista th.label-vista { background-color: #e2e2e2; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

.linha-vazia { display: inline-block; width: 45px; border-bottom: 1px solid black; text-align: center; font-weight: bold; }

/* Distribuicao Lado a Lado */
.distribuicao-container { display: flex; gap: 20px; align-items: stretch; margin-bottom: 20px; }
.distribuicao-tabela-box { flex: 0 0 45%; }
.distribuicao-tabela-box table { margin: 0; font-size: 9pt; }
.distribuicao-tabela-box th, .distribuicao-tabela-box td { padding: 4px; }
.distribuicao-texto-box { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
.linha-destaque { background-color: #fcd34d !important; font-weight: bold; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.linha-impedida { color: #999; text-decoration: line-through; }

/* Calendários */
.calendarios-container { display: flex; justify-content: center; gap: 20px; margin-top: 25px; page-break-inside: avoid; }
.calendario { border: 1px solid #000; padding: 10px; border-radius: 4px; font-size: 9pt; width: 185px; }
.cal-mes { text-align: center; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; font-size: 10pt; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 3px; }
.cal-header { font-weight: bold; color: #444; font-size: 8pt; border-bottom: 1px solid #ccc; padding-bottom: 3px; margin-bottom: 3px; }
.cal-day.domingo, .cal-day.sabado { color: #C00000; font-weight: bold; }
.cal-day.vazio { color: transparent; }

@media (max-width: 850px) {
    .folha-a4 { width: 98%; padding: 10px; margin: 10px auto; }
}
@media screen and (max-width: 600px) {
    .calendarios-container { flex-wrap: wrap; }
    .distribuicao-container { flex-direction: column; gap: 12px; }
}
@media print {
    .no-print, .painel-edicao-sec { display: none !important; }
    body { background: none; }
    .folha-a4 { margin: 0; padding: 0; box-shadow: none; width: 100%; min-height: auto; }
    table.tabela-roteiro, .calendarios-container { page-break-inside: avoid; }
    .caixa-secao { page-break-after: avoid; }
    @page { margin: 15mm; }
}
/* Condução da reunião — espelhar integralmente no outro HTML. */
.marcacao { display: inline-block; min-width: 1em; font-weight: bold; }
.marcacao.ok { color: #15803d; }
.marcacao.nao { color: #b91c1c; }
.marca-opcao { font: inherit; color: inherit; background: transparent; border: 0; padding: 0 3px; text-transform: none; cursor: default; }
.marca-opcao:disabled { opacity: 1; cursor: default; }
.folha-a4.interativo td.col-check, .folha-a4.interativo .marca-opcao:not(:disabled) { cursor: pointer; touch-action: manipulation; }
.folha-a4.interativo td.col-check:hover, .folha-a4.interativo .marca-opcao:not(:disabled):hover { background: #e0f2fe; }
.folha-a4.interativo [tabindex="0"]:focus-visible { outline: 2px solid #0284c7; outline-offset: -2px; }
.placar-quorum { font-size: 9pt; color: #334155; text-align: center; margin: 6px 0; }
.controle-vivo { padding: 8px; margin: 10px 0; background: #f0fdf4; border: 1px solid #86efac; font-size: 9pt; text-align: left; }
.controle-vivo label { display: block; margin: 4px 0; }
.folha-a4 button.no-print { display: block; }
.controle-vivo select { max-width: 100%; width: 100%; padding: 5px; font: inherit; color: #0f172a; background: white; border: 1px solid #94a3b8; }
.alerta-vista-sessao { padding: 10px; margin: 12px 0; border: 2px solid #b91c1c; background: #fef3c7; color: #991b1b; font-weight: bold; }
.status-conducao { font-size: 12px; padding: 5px 8px; border-radius: 4px; background: #334155; color: #f8fafc; }
@media print {
    .no-print, .painel-edicao-sec { display: none !important; }
    .marcacao, .alerta-vista-sessao, .placar-quorum { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .marca-opcao { color: #000; }
    .interativo td.col-check:hover, .interativo .marca-opcao:hover { background: transparent !important; }
}

/* Condução: controles fora da impressão; destaque não altera dimensões da folha. */
.widget-cronometro { position: relative; min-width: 0; color: #e2e8f0; background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 6px; font: 12px/1.4 Arial, sans-serif; }
.widget-cronometro button { text-transform: none; font-size: 11px; padding: 6px 8px; color: #f8fafc; background: #334155; }
.widget-cronometro button:disabled { opacity: .5; cursor: default; }
.tempo-toggle { width: 100%; }
.tempo-visor { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 10px; padding: 5px; font-variant-numeric: tabular-nums; }
.tempo-visor strong { font-size: 28px; line-height: 1.1; }
.tempo-orador { flex-basis: 100%; overflow-wrap: anywhere; }
.tempo-normal { color: #67e8f9; }
.tempo-alerta { color: #fcd34d; background: #422006; }
.tempo-critico { color: #fecaca; background: #7f1d1d; animation: tempo-pulso 1.2s ease-in-out infinite; }
.tempo-controles { display: grid; gap: 8px; padding-top: 8px; }
.tempo-controles label { display: grid; gap: 4px; font-size: 11px; }
.tempo-controles select, .tempo-controles input { width: 100%; min-width: 0; color: white; background: #1e293b; border: 1px solid #64748b; padding: 5px; border-radius: 4px; }
.tempo-botoes { display: flex; flex-wrap: wrap; gap: 4px; }
.tempo-modos { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
.widget-cronometro .tempo-modos [aria-pressed="true"] { background: #0369a1; color: #fff; outline: 1px solid #7dd3fc; }
.tempo-leitura { padding: 6px; font-size: 11px; color: #cbd5e1; }
.navegacao-foco { font: 12px/1.4 Arial, sans-serif; padding: 6px; background: #0f172a; color: #e2e8f0; border-radius: 6px; }
.navegacao-foco .tempo-botoes { margin-top: 5px; }
.conducao-presidente { order: 3; flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px; align-items: start; padding: 0 8px 6px; }
.conducao-presidente .widget-cronometro { width: 280px; max-width: 100%; }
.conducao-presidente .seguir-foco { font-size: 12px; padding: 8px; }
@media screen {
    .app-presidente > .painel-comandos { flex-wrap: wrap; }
    .folha-a4 .em-pauta-foco { box-shadow: inset 4px 0 #2563eb; outline: 1px solid #93c5fd; }
    .folha-a4 [id] { scroll-margin-top: 220px; }
    .foco-botao, .foco-selo { display: inline-block; margin: 4px 6px; padding: 3px 7px; border-radius: 4px; font: bold 10px/1.4 Arial, sans-serif; text-transform: none; background: #dbeafe; color: #1e40af; vertical-align: middle; }
    .foco-botao[aria-pressed="true"], .foco-selo { background: #1d4ed8; color: white; }
}
@media screen and (min-width: 960px) {
    .layout-lateral .conducao-presidente { padding: 8px; }
    .layout-lateral .folha-a4 [id] { scroll-margin-top: 20px; }
}
@keyframes tempo-pulso { 50% { background-color: #991b1b; } }
@media (prefers-reduced-motion: reduce) { .tempo-critico { animation: none; } }

</style>
</head>
<body>

<div id="app">
<div class="app-layout app-presidente" :class="['layout-' + uiLayout.posicao, { 'painel-recolhido': uiLayout.recolhido }]">
    <aside class="painel-comandos no-print" aria-label="Painel de comandos">
    <div class="layout-tools" role="group" aria-label="Posição e visibilidade do painel">
            <button type="button" class="btn-layout" @click="uiLayout.posicao = uiLayout.posicao === 'topo' ? 'lateral' : 'topo'" :title="uiLayout.posicao === 'topo' ? 'Fixar na Lateral (desktop)' : 'Fixar no Topo'" :aria-label="uiLayout.posicao === 'topo' ? 'Fixar na Lateral' : 'Fixar no Topo'">
                <span aria-hidden="true">{{ uiLayout.posicao === 'topo' ? '⬅️' : '⬆️' }}</span><span class="rotulo-layout">{{ uiLayout.posicao === 'topo' ? 'Fixar na Lateral' : 'Fixar no Topo' }}</span>
            </button>
            <button type="button" class="btn-layout" @click="uiLayout.recolhido = !uiLayout.recolhido" :aria-expanded="!uiLayout.recolhido" aria-controls="barra-presidente" :title="uiLayout.recolhido ? 'Mostrar Painel' : 'Ocultar Painel'" :aria-label="uiLayout.recolhido ? 'Mostrar Painel' : 'Ocultar Painel'">
                <span aria-hidden="true">{{ uiLayout.recolhido ? '☰' : '▤' }}</span><span class="rotulo-layout">{{ uiLayout.recolhido ? 'Mostrar Painel' : 'Ocultar Painel' }}</span>
            </button>
        </div>
    <div id="barra-presidente" class="no-print" v-show="!uiLayout.recolhido">
        <div class="campo-barra campo-comissao">
            <label for="comissao-presidente">COMISSÃO:</label>
            <select id="comissao-presidente" v-model="comissaoSelecionada" @change="carregarReunioesDaComissao" :title="comissoes.find(c => c.sigla === comissaoSelecionada)?.nome">
                <option v-for="c in comissoes" :key="c.sigla" :value="c.sigla">{{ c.sigla }} — {{ c.nome }}</option>
            </select>
        </div>
        <div class="campo-barra campo-reuniao">
            <label for="reuniao-presidente">REUNIÃO:</label>
            <select id="reuniao-presidente" v-model="reuniaoSelecionadaId" @change="carregarRoteiroEspecifico">
                <option v-if="listaReunioes.length === 0" :value="null">Nenhuma reunião publicada para esta comissão</option>
                <option v-for="r in listaReunioes" :key="r.id" :value="r.id">📅 {{ formatarData(r.data_reuniao) }} às {{ r.hora_inicio }} ({{ r.tipo_reuniao }})</option>
            </select>
        </div>
        <div class="campo-barra campo-modo">
            <label for="modo-presidente">MODO:</label>
            <select id="modo-presidente" v-model="modoPresidente">
                <option value="aovivo">⚡ Ao Vivo (Sincronizado)</option>
                <option value="branco">📄 Folha em Branco (Estático)</option>
                <option value="interativo">✍️ Interativo (Marcação Local)</option>
            </select>
        </div>
        <span v-if="modoPresidente === 'aovivo'" class="status-conducao" role="status">{{ statusRealtime }}</span>
        <button v-if="modoPresidente === 'interativo'" class="no-print" :disabled="!roteiroCarregado" @click="limparMarcacoesLocais" title="Limpar Marcações Locais">🧹 Limpar locais</button>
        <span v-if="modoPresidente === 'interativo'" :class="erroLocal ? 'erro-barra' : 'status-local'" role="status">{{ erroLocal || 'Somente neste navegador' }}</span>
        <span v-if="erroCarregamento" class="erro-barra" role="alert">{{ erroCarregamento }}</span>
        <div class="acoes-box">
            <button class="btn-refresh" @click="carregarRoteiroEspecifico" :disabled="!reuniaoSelecionadaId || carregando">{{ carregando ? 'Atualizando...' : '🔄 Atualizar' }}</button>
            <button class="btn-print" @click="imprimir" :disabled="!roteiroCarregado">🖨️ Imprimir</button>
        </div>
    </div>
    <div v-if="!uiLayout.recolhido && roteiroCarregado && modoPresidente !== 'branco'" class="conducao-presidente no-print">
        <widget-cronometro :estado="aoVivoExibido.cronometro" :permitido="podeInteragir" :membros="membrosConducao" @alterar="atualizarCronometro"></widget-cronometro>
        <label v-if="modoPresidente === 'aovivo'" class="seguir-foco"><input type="checkbox" v-model="seguirFocoSecretario"> Seguir foco</label>
        <template v-if="modoPresidente === 'interativo'"><div class="navegacao-foco no-print"><div>📍 Foco: {{ aoVivoExibido.foco_pauta?.rotulo || 'Nenhum item destacado' }}</div>

<script>
const SUPABASE_URL = 'https://stwdytpfdizwtaqtrarq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_cfCVWR24Jq4NripFuSo4xA_GFixfQGk';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });

// Contrato compartilhado: manter idêntico nos três HTMLs.
function criarAoVivo(origem = {}) {
    const objeto = v => v && typeof v === 'object' && !Array.isArray(v) ? v : {};
    const dados = objeto(origem);
    const estado = {
        pres_abertura: {}, pres_deliberacao: {}, status_quorum: null,
        relatores_escolhidos: {}, res_info: {}, res_delib: {}, votos: {},
        resultado_votacao: {}, votos_emendas: {}, resultado_emendas: {},
        eleitos: {}, novo_relator_art67: {}, vista_em_sessao: {}, foco_pauta: null, cronometro: {}
    };
    const resultado = v => ['aprovado', 'rejeitado'].includes(v);
    const voto = v => ['F', 'C'].includes(v);
    const id = v => (typeof v === 'number' && Number.isFinite(v)) || typeof v === 'string';
    function mapa(valor, valido) {
        return Object.fromEntries(Object.entries(objeto(valor)).filter(([k,v]) => !['__proto__','constructor','prototype'].includes(k) && valido(v)));
    }
    for (const campo of ['pres_abertura','pres_deliberacao','res_info','res_delib']) estado[campo] = mapa(dados[campo], v => v === true);
    for (const campo of ['relatores_escolhidos','eleitos','novo_relator_art67']) estado[campo] = mapa(dados[campo], id);
    estado.status_quorum = ['sim','nao'].includes(dados.status_quorum) ? dados.status_quorum : null;
    estado.vista_em_sessao = mapa(dados.vista_em_sessao, v => typeof v === 'string');
    estado.resultado_votacao = mapa(dados.resultado_votacao, resultado);
    for (const [chave, valor] of Object.entries(mapa(dados.votos, v => objeto(v) === v))) estado.votos[chave] = mapa(valor, voto);
    for (const [chave, valor] of Object.entries(mapa(dados.resultado_emendas, v => objeto(v) === v))) estado.resultado_emendas[chave] = mapa(valor, resultado);
    for (const [chave, valor] of Object.entries(mapa(dados.votos_emendas, v => objeto(v) === v))) {
        estado.votos_emendas[chave] = {};
        for (const [n, votos] of Object.entries(mapa(valor, v => objeto(v) === v))) estado.votos_emendas[chave][n] = mapa(votos, voto);
    }
    const foco = objeto(dados.foco_pauta);
    if (['abertura','atas','expediente','distribuicao','conhecimento','quorum','ordem_do_dia','assuntos_gerais','encerramento'].includes(foco.secao)) {
        estado.foco_pauta = { secao: foco.secao, rotulo: typeof foco.rotulo === 'string' ? foco.rotulo : '' };
        if (typeof foco.item_id === 'string' && foco.item_id) estado.foco_pauta.item_id = foco.item_id;
    }
    const c = objeto(dados.cronometro);
    const positivo = v => typeof v === 'number' && Number.isFinite(v) && v >= 0;
    estado.cronometro = {
        modo: c.modo === 'progressivo' ? 'progressivo' : 'regressivo',
        status: ['parado','rodando','pausado'].includes(c.status) ? c.status : 'parado',
        duracao_seg: positivo(c.duracao_seg) && Number.isSafeInteger(c.duracao_seg) ? c.duracao_seg : 300,
        acumulado_seg: positivo(c.acumulado_seg) ? c.acumulado_seg : 0,
        iniciado_em_ms: positivo(c.iniciado_em_ms) && c.iniciado_em_ms > 0 ? c.iniciado_em_ms : null,
        orador: typeof c.orador === 'string' ? c.orador : ''
    };
    // Um estado rodando sem instante válido não pode avançar de forma confiável.
    if (estado.cronometro.status === 'rodando' && !estado.cronometro.iniciado_em_ms) estado.cronometro.status = 'pausado';
    if (estado.cronometro.status !== 'rodando') estado.cronometro.iniciado_em_ms = null;
    return estado;
}

// Tempo calculado localmente: nenhum tick altera o estado persistido.
function tempoDecorrido(c, agora = Date.now()) {
    return c.acumulado_seg + (c.status === 'rodando' && c.iniciado_em_ms
        ? Math.max(0, Math.floor((agora - c.iniciado_em_ms) / 1000)) : 0);
}
function visorCronometro(c, agora = Date.now()) {
    const decorrido = tempoDecorrido(c, agora);
    const valor = c.modo === 'progressivo' ? decorrido : c.duracao_seg - decorrido;
    const absoluto = Math.floor(Math.abs(valor));
    return {
        texto: (valor < 0 ? '-' : '') + String(Math.floor(absoluto / 60)).padStart(2, '0') + ':' + String(absoluto % 60).padStart(2, '0'),
        classe: c.modo === 'regressivo' && valor < 0 ? 'tempo-critico'
            : c.modo === 'regressivo' && valor <= 30 && c.status === 'rodando' ? 'tempo-alerta' : 'tempo-normal'
    };
}

const { createApp, ref, reactive, computed, onMounted, watch, onBeforeUnmount, nextTick } = Vue;


// Widget compartilhado entre secretário e presidente. Emite somente ações humanas.
const WidgetCronometro = {
    props: ['estado', 'permitido', 'membros'],
    emits: ['alterar'],
    setup(props, { emit }) {
        const aberto = ref(false), agora = ref(Date.now());
        const oradorTexto = ref(props.estado.orador || '');
        watch(() => props.estado.orador, v => { if (v !== oradorTexto.value) oradorTexto.value = v || ''; });
        let intervalo;
        onMounted(() => { intervalo = setInterval(() => { agora.value = Date.now(); }, 250); });
        onBeforeUnmount(() => clearInterval(intervalo));
        const visor = computed(() => visorCronometro(props.estado, agora.value));
        function acao(tipo, valor) {
            if (!props.permitido) return;
            const c = { ...props.estado }, instante = Date.now();
            if (tipo === 'iniciar') {
                if (c.status === 'rodando') return;
                c.status = 'rodando'; c.iniciado_em_ms = instante;
            } else if (tipo === 'pausar') {
                if (c.status !== 'rodando') return;
                c.acumulado_seg = tempoDecorrido(c, instante); c.status = 'pausado'; c.iniciado_em_ms = null;
            } else if (tipo === 'zerar' || tipo === 'modo' || tipo === 'definir') {
                if (tipo === 'definir') {
                    if (!Number.isSafeInteger(valor) || valor < 0) return;
                    c.modo = 'regressivo'; c.duracao_seg = valor;
                }
                if (tipo === 'modo') c.modo = valor === 'progressivo' ? 'progressivo' : 'regressivo';
                c.status = 'parado'; c.acumulado_seg = 0; c.iniciado_em_ms = null;
            } else if (tipo === 'mais') {
                const acrescimo = valor === 300 ? 300 : 60;
                if (c.modo !== 'regressivo' || !Number.isSafeInteger(c.duracao_seg + acrescimo)) return;
                c.duracao_seg += acrescimo;
            } else if (tipo === 'orador') { oradorTexto.value = String(valor || ''); c.orador = oradorTexto.value; }
            else return;
            emit('alterar', c);
        }
        return { aberto, oradorTexto, visor, acao };
    },
    template: `<section class="widget-cronometro no-print" aria-label="Tempo de manifestação">
        <button type="button" class="tempo-toggle" :aria-expanded="aberto" @click="aberto = !aberto">⏱️ Cronômetro / Tempo {{ aberto ? '▴' : '▾' }}</button>
        <div v-if="estado.status !== 'parado' || aberto" class="tempo-visor" :class="visor.classe">
            <strong>{{ visor.texto }}</strong><span>{{ estado.modo === 'progressivo' ? 'Progressivo ↑' : 'Regressivo' }} · {{ estado.status }}</span>
            <span v-if="estado.orador" class="tempo-orador">{{ estado.orador }}</span>
        </div>
        <div v-if="aberto && permitido" class="tempo-controles">
            <div class="tempo-modos" role="group" aria-label="Modo do cronômetro">
                <button type="button" :aria-pressed="estado.modo === 'regressivo'" @click="acao('modo', 'regressivo')">⏳ Regressivo</button>
                <button type="button" :aria-pressed="estado.modo === 'progressivo'" @click="acao('modo', 'progressivo')">⏱️ Crescente 00:00 ↑</button>
            </div>
            <div class="tempo-botoes"><button v-for="m in [1,3,5,10,15,20]" :key="m" type="button" @click="acao('definir', m * 60)" :title="'Carregar ' + m + ' minutos; use Iniciar'">{{ m }}m</button></div>
            <div class="tempo-botoes">
                <button type="button" :disabled="estado.status === 'rodando'" @click="acao('iniciar')">▶ Iniciar / Retomar</button>
                <button type="button" :disabled="estado.status !== 'rodando'" @click="acao('pausar')">⏸ Pausar</button>
                <button type="button" :disabled="estado.modo !== 'regressivo'" @click="acao('mais')">+1m</button>

// Foco individual: manter idêntico nos três HTMLs. Não modifica a pauta.
function itensFocoPauta(pauta) {
    const e = pauta.leitura_expediente || {}, c = pauta.conhecimento_materias || {};
    const grupos = [
        ['expediente', 'corr', 'Leitura do Expediente', 'Correspondência', e.correspondencias_recebidas],
        ['expediente', 'rec', 'Leitura do Expediente', 'Proposição recebida', e.proposicoes_recebidas],
        ['expediente', 'dist', 'Leitura do Expediente', 'Proposição distribuída', e.proposicoes_distribuidas],
        ['distribuicao', 'mad', 'Matérias a Distribuir', 'Item', e.materias_a_distribuir],
        ['conhecimento', 'inf', 'Conhecimento de Matérias', 'Informativo', c.informativos],
        ['conhecimento', 'deladm', 'Conhecimento de Matérias', 'Deliberação', c.deliberativos_administrativos],
        ['conhecimento', 'aud', 'Conhecimento de Matérias', 'Audiência', c.audiencias_agendadas],
        ['conhecimento', 'req', 'Conhecimento de Matérias', 'Requerimento', c.requerimentos_conhecimento],
        ['ordem_do_dia', 'od', 'Ordem do Dia', 'Item', pauta.ordem_do_dia],
        ['assuntos_gerais', 'ag', 'Assuntos Gerais', 'Item', pauta.assuntos_gerais?.itens]
    ];
    const itens = grupos.flatMap(([secao, grupo, titulo, especie, lista]) => (lista || []).map((item, indice) => ({
        secao, grupo, item, indice, total: lista.length, ancora: `${grupo}-${indice}`,
        item_id: ['rec','dist','mad','req','od'].includes(grupo) && item?.id ? String(item.id) : `${grupo}-${indice}`,
        rotulo: `${titulo} — ${especie} ${indice + 1} de ${lista.length}` + (item?.tipo ? `: ${item.tipo} ${item.numero || ''}/${item.ano || ''}` : '')
    })));
    // Uma proposição pode aparecer em duas alíneas do mesmo Expediente.
    // Nessa colisão, a âncora da alínea desambigua o foco sem alterar IDs legislativos.
    const contagens = new Map();
    for (const it of itens) { const chave = `${it.secao}:${it.item_id}`; contagens.set(chave, (contagens.get(chave) || 0) + 1); }
    return itens.map(it => contagens.get(`${it.secao}:${it.item_id}`) > 1 ? { ...it, item_id: it.ancora } : it);
}

function usarFocoPauta(pauta, exibido, edicao, permitido, mostrar) {
    const titulos = { abertura: 'Abertura', atas: 'Aprovação de Atas', expediente: 'Expediente', distribuicao: 'Matérias a Distribuir',
        conhecimento: 'Conhecimento de Matérias', quorum: 'Verificação de Quórum', ordem_do_dia: 'Ordem do Dia',
        assuntos_gerais: 'Assuntos Gerais', encerramento: 'Encerramento' };
    const itens = computed(() => itensFocoPauta(pauta));
    const idDoFoco = item => typeof item === 'string' ? item : item?.id != null ? String(item.id) : '';
    const focoIgual = (a, b) => !!a && !!b && a.secao === b.secao && (a.item_id || '') === (b.item_id || '');
    function idFocoItem(grupo, idx) { return itens.value.find(it => it.grupo === grupo && it.indice === idx)?.item_id || `${grupo}-${idx}`; }
    function focoAtivo(secao, item = null) { return mostrar.value && focoIgual(exibido.value.foco_pauta, { secao, item_id: idDoFoco(item) }); }
    function criarFoco(secao, item = null, idx = 0) {
        const id = idDoFoco(item), descritor = itens.value.find(it => it.secao === secao && it.item_id === id);
        return { secao, ...(id ? { item_id: id } : {}),
            rotulo: descritor?.rotulo || titulos[secao] + (id ? ` — Item ${idx + 1}` : '') };
    }
    function destacarFoco(secao, item = null, idx = 0) {
        if (!permitido.value) return;
        const foco = criarFoco(secao, item, idx);
        edicao.value.foco_pauta = focoIgual(edicao.value.foco_pauta, foco) ? null : foco;
    }
    const sequenciaFoco = computed(() => ['abertura','atas','expediente','distribuicao','conhecimento','quorum','ordem_do_dia','assuntos_gerais','encerramento'].flatMap(secao => {
        const daSecao = itens.value.filter(it => it.secao === secao).map(it => criarFoco(secao, it.item_id, it.indice));
        // Distribuição e OD mantêm o avanço direto por matéria; títulos continuam selecionáveis.
        return ['distribuicao','ordem_do_dia'].includes(secao) ? daSecao : [criarFoco(secao), ...daSecao];
    }));
    async function avancarFoco(delta) {
        if (!permitido.value) return;
        const lista = sequenciaFoco.value, atual = edicao.value.foco_pauta;
        let idx = lista.findIndex(f => focoIgual(f, atual));
        // Um título selecionado diretamente entra antes do primeiro item daquela seção.
        if (idx < 0 && atual && !atual.item_id) {
            const primeiro = lista.findIndex(f => f.secao === atual.secao);
            if (primeiro >= 0) idx = delta > 0 ? primeiro - 1 : primeiro;
        }
        const foco = { ...lista[idx < 0 ? (delta > 0 ? 0 : lista.length - 1) : Math.max(0, Math.min(lista.length - 1, idx + delta))] };
        edicao.value.foco_pauta = foco;
        await nextTick();
        if (permitido.value && focoIgual(edicao.value.foco_pauta, foco))
            document.getElementById(ancoraFoco(foco))?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function ancoraFoco(foco) {
        if (!foco) return null;
        if (foco.item_id) {
            const item = itens.value.find(it => it.secao === foco.secao && it.item_id === foco.item_id);
            if (item) return item.ancora;
        }
        return 'sec-' + foco.secao.replaceAll('_', '-');
    }
    function atualizarCronometro(c) {
        if (permitido.value) edicao.value.cronometro = criarAoVivo({ cronometro: c }).cronometro;
    }
    return { focoAtivo, destacarFoco, avancarFoco, ancoraFoco, atualizarCronometro, idFocoItem };
}

createApp({
    components: { WidgetCronometro },
    setup() {
        // Preferência de interface, separada do preparo e das marcações locais.

                if (typeof salvo.recolhido === 'boolean') uiLayout.recolhido = salvo.recolhido;
            }
        } catch { erroUiLayout.value = 'Preferência visual indisponível; usando o layout padrão.'; }
        watch(uiLayout, valor => {
            try { localStorage.setItem(chaveUiLayout, JSON.stringify(valor)); erroUiLayout.value = ''; }

        }, { deep: true });

        const comissoes = ref([]);
        const comissaoSelecionada = ref('CEDST');
        const listaReunioes = ref([]);

        const carregando = ref(false);
        const roteiroCarregado = ref(false);

        const pauta = reactive({

            conhecimento_materias: { informativos: [], requerimentos_conhecimento: [], deliberativos_administrativos: [], audiencias_agendadas: [] },
            ordem_do_dia: [], assuntos_gerais: { itens: [], proxima_reuniao: null, proxima_reuniao_custom: '' }
        });
        const snapshotMembros = reactive({ presidente_id: null, vice_presidente_id: null, titulares: [], suplentes: [] });
        const atasEstruturadas = computed(() => pauta.aprovacao_atas.atas.filter(ata => !ata.texto_livre));
        const atasTextoLivre = computed(() => pauta.aprovacao_atas.atas.filter(ata => !!ata.texto_livre));
        const preparo = reactive({ relatores_grade: {}, historico: {}, ao_vivo: criarAoVivo() });
        const modoPresidente = ref('aovivo');
        const seguirFocoSecretario = ref(true);
        const aoVivoLocal = ref(criarAoVivo());
        const erroLocal = ref('');
        const erroCarregamento = ref('');
        const podeInteragir = computed(() => modoPresidente.value === 'interativo' && roteiroCarregado.value && !carregando.value);
        const mostrarMarcacoes = computed(() => modoPresidente.value !== 'branco');
        const permiteEditarGrade = false;
        const definirRelatorGrade = () => {};
        const quorumMinimoAbertura = 3;
        const quorumMinimoDeliberacao = 7;
        const aoVivoEdicao = computed(() => aoVivoLocal.value);
        const aoVivoExibido = computed(() => modoPresidente.value === 'branco' ? criarAoVivo() : modoPresidente.value === 'interativo' ? aoVivoLocal.value : preparo.ao_vivo);
        let idLocal = null;
        function chaveLocal(id) { return `alrs:presidente:ao_vivo:v1:${id}`; }
        function carregarMarcacoesLocais(id) {
            idLocal = null;
            erroLocal.value = '';
            try {
                const salvo = localStorage.getItem(chaveLocal(id));
                aoVivoLocal.value = criarAoVivo(salvo ? JSON.parse(salvo) : preparo.ao_vivo);
            } catch {
                aoVivoLocal.value = criarAoVivo(preparo.ao_vivo);
                erroLocal.value = '⚠️ Não foi possível ler as marcações locais; usando cópia da reunião.';
            }
            idLocal = id;
        }
        function persistirMarcacoesLocais() {
            if (!idLocal || idLocal !== reuniaoSelecionadaId.value) return;

            catch { erroLocal.value = '⚠️ Armazenamento local indisponível. As marcações estão apenas na memória desta aba.'; }
        }
        watch(aoVivoLocal, persistirMarcacoesLocais, { deep: true, flush: 'sync' });
        watch(modoPresidente, modo => { if (modo === 'interativo') persistirMarcacoesLocais(); });
        function limparMarcacoesLocais() {
            if (!podeInteragir.value) return;
            if (confirm('Limpar todas as marcações locais desta reunião neste navegador?')) aoVivoLocal.value = criarAoVivo();
        }
        const { focoAtivo, destacarFoco, avancarFoco, ancoraFoco, atualizarCronometro, idFocoItem } =
            usarFocoPauta(pauta, aoVivoExibido, aoVivoEdicao, podeInteragir, mostrarMarcacoes);
        // Interação compartilhada: todas as escritas passam pelo modo habilitado.
        const membrosConducao = computed(() => Array.from(new Map(todosMembrosSnapshot.value.filter(d => d.id != null).map(d => [String(d.id), d])).values()));
        const idsConducao = computed(() => new Set(membrosConducao.value.map(d => String(d.id))));
        function contarPresentes(campo) { return Object.keys(aoVivoExibido.value[campo]).filter(id => idsConducao.value.has(id) && aoVivoExibido.value[campo][id]).length; }
        function alternarPresenca(campo, membro) {
            if (!podeInteragir.value || !membro?.id) return;
            const mapa = aoVivoEdicao.value[campo];
            if (mapa[membro.id]) delete mapa[membro.id]; else mapa[membro.id] = true;
        }
        function copiarPresentesAbertura() {
            if (!podeInteragir.value) return;
            aoVivoEdicao.value.pres_deliberacao = Object.fromEntries(Object.entries(aoVivoEdicao.value.pres_abertura).filter(([id, marcado]) => marcado && idsConducao.value.has(id)));
        }
        function alternarMarca(campo, chave, valor = true) {
            if (!podeInteragir.value) return;
            if (campo === 'status_quorum') {
                aoVivoEdicao.value.status_quorum = aoVivoEdicao.value.status_quorum === valor ? null : valor;
            } else {
                const mapa = aoVivoEdicao.value[campo];
                if (mapa[chave] === valor) delete mapa[chave]; else mapa[chave] = valor;
            }
        }
        function definirCampo(campo, chave, valor) {
            if (!podeInteragir.value) return;
            if (!valor) delete aoVivoEdicao.value[campo][chave]; else aoVivoEdicao.value[campo][chave] = valor;
        }
        function votosDoItem(id, n = null) { return n === null ? aoVivoExibido.value.votos[id] || {} : aoVivoExibido.value.votos_emendas[id]?.[n] || {}; }
        function contarVotos(id, sentido, n = null) {
            const votos = Object.entries(votosDoItem(id, n)).filter(([dep]) => idsConducao.value.has(dep));
            return votos.length ? votos.filter(([,v]) => v === sentido).length : '';
        }
        function alternarVoto(item, membro, sentido, n = null) {
            if (!podeInteragir.value || !membro?.id || aoVivoEdicao.value.vista_em_sessao[item.id]) return;
            const vivo = aoVivoEdicao.value;
            const raiz = n === null ? vivo.votos : (vivo.votos_emendas[item.id] ||= {});
            const mapa = (raiz[n === null ? item.id : n] ||= {});
            if (mapa[membro.id] === sentido) delete mapa[membro.id]; else mapa[membro.id] = sentido;
        }
        function marcarResultado(item, valor, n = null) {
            if (!podeInteragir.value || aoVivoEdicao.value.vista_em_sessao[item.id]) return;
            const mapa = n === null ? aoVivoEdicao.value.resultado_votacao : (aoVivoEdicao.value.resultado_emendas[item.id] ||= {});
            const chave = n === null ? item.id : n;
            if (mapa[chave] === valor) delete mapa[chave]; else mapa[chave] = valor;
        }


        onMounted(async () => {
            const { data } = await sb.from('comissoes').select('sigla, nome').order('sigla');
            if (data) comissoes.value = data;
            await carregarReunioesDaComissao();
        });

        const conexaoRealtime = ref('CLOSED');
        const statusRealtime = computed(() => ({
            SUBSCRIBED: '✓ Ao Vivo Conectado', CONNECTING: '⚡ Conectando ao vivo...',
            CHANNEL_ERROR: '⚠️ Ao Vivo desconectado — tentando reconectar',
            TIMED_OUT: '⚠️ Conexão ao vivo expirou — tentando reconectar',
            CLOSED: '○ Ao Vivo desconectado'
        }[conexaoRealtime.value] || '○ Ao Vivo desconectado'));
        let canalRealtime = null;
        let geracaoCanal = 0;
        let pedidoLista = 0;
        let pedidoRoteiro = 0;
        let versaoRecebida = 0;
        let ultimoUpdatedAt = '';
        function encerrarRealtime() {
            ++geracaoCanal;
            if (canalRealtime) { const canal = canalRealtime; canalRealtime = null; sb.removeChannel(canal); }
            conexaoRealtime.value = 'CLOSED';
        }
        watch(reuniaoSelecionadaId, () => {
            encerrarRealtime();
            ++pedidoRoteiro;
            idLocal = null;
            roteiroCarregado.value = false;
            ultimoUpdatedAt = '';
        }, { flush: 'sync' });
        onBeforeUnmount(encerrarRealtime);
        async function aplicarRegistro(data, preservarScroll = false) {
            if (data.id !== reuniaoSelecionadaId.value) return;
            if (data.updated_at && ultimoUpdatedAt && data.updated_at < ultimoUpdatedAt) return;
            const x = window.scrollX, y = window.scrollY;
            const focoAnterior = JSON.stringify(preparo.ao_vivo.foco_pauta);

            Object.assign(pauta, data.pauta_json);
            Object.assign(snapshotMembros, { presidente_id: null, vice_presidente_id: null, titulares: [], suplentes: [] }, data.snapshot_membros);
            preparo.relatores_grade = data.preparo_json?.relatores_grade || {};
            preparo.historico = data.preparo_json?.historico || {};
            preparo.ao_vivo = criarAoVivo(data.preparo_json?.ao_vivo);
            ultimoUpdatedAt = data.updated_at || '';
            roteiroCarregado.value = true;
            if (idLocal !== data.id) carregarMarcacoesLocais(data.id);
            const focoAtual = JSON.stringify(preparo.ao_vivo.foco_pauta);
            await nextTick();
            if (data.id !== reuniaoSelecionadaId.value) return;
            if (modoPresidente.value === 'aovivo' && seguirFocoSecretario.value && focoAtual !== focoAnterior && preparo.ao_vivo.foco_pauta) {
                document.getElementById(ancoraFoco(preparo.ao_vivo.foco_pauta))?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            } else if (preservarScroll) window.scrollTo(x, y);
        }
        function assinarRealtime(id) {
            encerrarRealtime();
            const geracao = geracaoCanal;
            conexaoRealtime.value = 'CONNECTING';
            canalRealtime = sb.channel(`reuniao:${id}:${geracao}`)
                .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'reunioes', filter: `id=eq.${id}` }, payload => {
                    if (geracao !== geracaoCanal || id !== reuniaoSelecionadaId.value) return;
                    ++versaoRecebida;
                    aplicarRegistro(payload.new, true);
                })
                .subscribe(async status => {
                    if (geracao !== geracaoCanal || id !== reuniaoSelecionadaId.value) return;
                    conexaoRealtime.value = status;
                    // Recupera também alterações ocorridas entre o SELECT e a assinatura/reconexão.
                    if (status === 'SUBSCRIBED') {
                        const versao = versaoRecebida;
                        try {
                            const { data, error } = await sb.from('reunioes').select('*').eq('id', id).single();
                            if (geracao !== geracaoCanal || id !== reuniaoSelecionadaId.value || versao !== versaoRecebida) return;
                            if (error) erroCarregamento.value = 'Não foi possível conferir a atualização. Use Atualizar.';
                            else if (data) { erroCarregamento.value = ''; aplicarRegistro(data, true); }
                        } catch { if (geracao === geracaoCanal) erroCarregamento.value = 'Sem conexão para conferir a atualização.'; }
                    }
                });

            const pedido = ++pedidoLista;

            encerrarRealtime();

            roteiroCarregado.value = false;
            listaReunioes.value = [];
            erroCarregamento.value = '';

                const { data, error } = await sb.from('reunioes')
                    .select('id, data_reuniao, hora_inicio, tipo_reuniao')
                    .eq('comissao_sigla', comissaoSelecionada.value)
                    .order('data_reuniao', { ascending: false });

                if (error) throw error;
                listaReunioes.value = data || [];
                if (listaReunioes.value.length) {
                    reuniaoSelecionadaId.value = listaReunioes.value[0].id;
                    await carregarRoteiroEspecifico();
                }
            } catch { if (pedido === pedidoLista) erroCarregamento.value = 'Não foi possível carregar a lista de reuniões.'; }
            finally { if (pedido === pedidoLista) carregando.value = false; }
        }
        async function carregarRoteiroEspecifico() {
            const id = reuniaoSelecionadaId.value;
            if (!id) return;
            const pedido = ++pedidoRoteiro;
            const versao = versaoRecebida;
            carregando.value = !roteiroCarregado.value;
            erroCarregamento.value = '';
            try {
                const { data, error } = await sb.from('reunioes').select('*').eq('id', id).single();
                if (pedido !== pedidoRoteiro || id !== reuniaoSelecionadaId.value) return;
                if (error || !data) throw error || new Error('Reunião não encontrada');
                if (versao === versaoRecebida) await aplicarRegistro(data, roteiroCarregado.value);
                if (!canalRealtime) assinarRealtime(id);
            } catch { if (pedido === pedidoRoteiro) erroCarregamento.value = 'Não foi possível carregar o roteiro. Use Atualizar para tentar novamente.'; }
            finally { if (pedido === pedidoRoteiro) carregando.value = false; }
        }

        const nomeComissaoCompleto = computed(() => {
            const com = comissoes.value.find(c => c.sigla === pauta.metadados.sigla);
            return com ? com.nome : pauta.metadados.comissao;
        });

        const titularesOrdenados = computed(() => {
            const tits = [...(snapshotMembros.titulares || [])];
            const presId = snapshotMembros.presidente_id;
            const viceId = snapshotMembros.vice_presidente_id;
            const marcados = tits.map(m => ({
                ...m, id: m.id_assembleia || m.id,
                isPresidente: (m.id_assembleia || m.id) === presId,
                isVice: (m.id_assembleia || m.id) === viceId
            }));
            const presidente = marcados.find(t => t.isPresidente);
            const outros = marcados.filter(t => !t.isPresidente).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
            return presidente ? [presidente, ...outros] : outros;
        });

        const titularesApenasOrdemAlfabetica = computed(() => [...(snapshotMembros.titulares || [])].map(m => ({...m, id: m.id_assembleia || m.id})).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR')));
        const suplentesOrdenados = computed(() => [...(snapshotMembros.suplentes || [])].map(m => ({...m, id: m.id_assembleia || m.id})).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR')));

        const tabelaMembros = computed(() => {
            const linhas = []; const t = titularesOrdenados.value; const s = suplentesOrdenados.value;
            for(let i=0; i<12; i++) linhas.push({ titular: t[i] || null, suplente: s[i] || null });
            return linhas;
        });

        function formatarNomeMembro(membro) {
            if (!membro) return '';
            let sufixo = '';
            if (membro.isPresidente) sufixo = ' | Presidente';
            else if (membro.isVice) sufixo = ' | Vice-presidente';
            const partidoExibido = membro.partido === 'REPUBLICANOS' ? 'REPUB' : membro.partido;
            return `${membro.nome} (${partidoExibido})${sufixo}`;
        }

        const todosMembrosSnapshot = computed(() => [...(snapshotMembros.titulares || []), ...(snapshotMembros.suplentes || [])].map(m => ({...m, id: m.id_assembleia || m.id})));
        const bancadasComissao = computed(() => {
            const bancadas = new Set();
            todosMembrosSnapshot.value.forEach(dep => { if(dep.partido) bancadas.add(dep.partido); });
            return Array.from(bancadas).sort();
        });

        const temConhecimento = computed(() => {
            const c = pauta.conhecimento_materias;
            return (c.informativos?.length > 0) || (c.deliberativos_administrativos?.length > 0) || (c.audiencias_agendadas?.length > 0) || (c.requerimentos_conhecimento?.length > 0);
        });

        function ehFaseB(it) { return !!it._fase_b || (it.votacao_conclusiva && !it.relator && !it.parecer); }
        function elegivelNovoRelator(tipo) { return ['PL', 'PLC', 'PEC', 'PDL', 'RDI'].includes(tipo); }

        function gerarResumoPareceresFaseB(it) {
            if (!it.pareceres_anteriores || it.pareceres_anteriores.length === 0) return '';
            const partes = it.pareceres_anteriores.map(pa => {
                const sentido = pa.parecer === 'favoravel_com_emendas' ? 'favorável com emenda' : (pa.parecer === 'contrario' ? 'contrário' : 'favorável');
                const ehCCJ = /Constitui[çc][ãa]o\s+e\s+Justi[çc]a/i.test(pa.comissao);
                const local = ehCCJ ? 'na CCJ' : 'nesta comissão';
                return `${sentido} ${local}, relator(a) Deputado(a) ${pa.relator}`;
            });
            return `Projeto recebeu parecer ${partes.join(', e ')}.`;
        }

        function bancadaJaPediuVista(itemId, sigla) {
            const lista = preparo.historico?.[itemId]?.vistas_detalhadas || [];
            const vistaEmSessao = aoVivoExibido.value.vista_em_sessao[itemId] || '';
            return lista.some(v => v.bancada === sigla) || vistaEmSessao.startsWith('BANCADA ' + sigla + ' ');
        }

        function getTitularesElegiveis(bancadaImpedida) {
            return titularesApenasOrdemAlfabetica.value.filter(d => !bancadaImpedida || (d.partido || '').toUpperCase() !== String(bancadaImpedida).toUpperCase());
        }
        function getListaNomesImpedidos(bancadaImpedida) {
            if (!bancadaImpedida) return '';
            const imp = String(bancadaImpedida).toUpperCase();
            const nomes = titularesApenasOrdemAlfabetica.value.filter(d => (d.partido || '').toUpperCase() === imp).map(d => d.nome);
            return nomes.length > 0 ? `(${nomes.join(', ')})` : '';
        }

        function getNomeRelator(id) {
            if (!id) return null;
            const dep = todosMembrosSnapshot.value.find(d => String(d.id) === String(id));
            return dep ? `${dep.nome} (${dep.partido})` : null;
        }

        function formatarData(isoData) {
            if (!isoData) return '';
            const p = isoData.split('-');
            return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : isoData;
        }

        function formatarDataMesExtensoCurto(isoData) {
            if (!isoData) return '';
            const p = isoData.split('-');
            if (p.length !== 3) return isoData;
            const meses = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
            return `${p[2]}/${meses[parseInt(p[1], 10) - 1]}/${p[0]}`;
        }

        function formatarHoraRoteiro(hora) { return hora ? hora.replace(':', 'H') : '09H00'; }

        function formatarDataExtenso(strData) {
            if (!strData) return '';
            if (strData.includes(' de ')) return strData;
            const p = strData.split('-');
            if (p.length !== 3) return strData;
            const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
            return `${parseInt(p[2], 10)} de ${meses[parseInt(p[1], 10)-1]} de ${p[0]}`;
        }

        function formatarParecer(parecer) {
            if (!parecer) return '_________';
            if (parecer === 'favoravel') return 'Favorável';
            if (parecer === 'favoravel_com_emendas') return 'Favorável com emendas';
            return 'Contrário';
        }

        function formatarStringEmenda(num, conectivo = '+') {
            if (!num || num <= 0) return '';
            if (num === 1) return `${conectivo} ${conectivo === 'E' ? 'A ' : ''}EMENDA`;
            return `${conectivo} ${conectivo === 'E' ? 'AS ' : ''}EMENDAS`;
        }

        const textoAberturaDinamico = computed(() => {
            if(!pauta.metadados.data) return "DATA NÃO IDENTIFICADA, PRESENTES ...";
            const [y, m, d] = pauta.metadados.data.split('-');
            const date = new Date(y, m - 1, d);
            const dias = ['DOMINGO', 'SEGUNDA-FEIRA', 'TERÇA-FEIRA', 'QUARTA-FEIRA', 'QUINTA-FEIRA', 'SEXTA-FEIRA', 'SÁBADO'];
            const meses = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
            return `${dias[date.getDay()]} DIA ${d} DE ${meses[date.getMonth()]} DE ${y}, PRESENTES ...`;
        });

        const listaCalendarios = computed(() => {
            const dataBase = pauta.metadados.data ? pauta.metadados.data : new Date().toISOString().split('T')[0];
            const [y, m] = dataBase.split('-');
            let currentDate = new Date(y, m - 1, 1);
            const cals = [];
            const mesesStr = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
            for(let i=0; i<3; i++) {
                const ano = currentDate.getFullYear(); const mes = currentDate.getMonth();
                const diasNoMes = new Date(ano, mes + 1, 0).getDate();
                const diaSemanaInicio = new Date(ano, mes, 1).getDay(); 
                const diasArray = Array(42).fill(null);
                for(let dia = 1; dia <= diasNoMes; dia++) diasArray[diaSemanaInicio + dia - 1] = dia;
                if(!diasArray.slice(35).some(Boolean)) diasArray.splice(35);
                cals.push({ mesAno: `${mesesStr[mes]} ${ano}`, dias: diasArray });
                currentDate.setMonth(currentDate.getMonth() + 1);
            }
            return cals;
        });

        function imprimir() { window.print(); }

        return {
            uiLayout, erroUiLayout,
            focoAtivo, destacarFoco, avancarFoco, atualizarCronometro, idFocoItem,
            podeInteragir, mostrarMarcacoes, aoVivoExibido, membrosConducao, contarPresentes, alternarPresenca,
            copiarPresentesAbertura, alternarMarca, definirCampo, votosDoItem, contarVotos, alternarVoto, marcarResultado,
            seguirFocoSecretario, modoPresidente, aoVivoLocal, erroLocal, erroCarregamento, statusRealtime, limparMarcacoesLocais,
            permiteEditarGrade, definirRelatorGrade, quorumMinimoAbertura, quorumMinimoDeliberacao, getTitularesElegiveis,
            comissoes, comissaoSelecionada, listaReunioes, reuniaoSelecionadaId, carregando, roteiroCarregado,
            carregarReunioesDaComissao, carregarRoteiroEspecifico,
            pauta, preparo, nomeComissaoCompleto, tabelaMembros, formatarNomeMembro,
            atasEstruturadas, atasTextoLivre,
            titularesApenasOrdemAlfabetica, bancadasComissao, temConhecimento,
            ehFaseB, elegivelNovoRelator, gerarResumoPareceresFaseB, bancadaJaPediuVista, getListaNomesImpedidos, getNomeRelator,
            formatarData, formatarDataMesExtensoCurto, formatarHoraRoteiro, formatarDataExtenso, formatarParecer, formatarStringEmenda,
            textoAberturaDinamico, listaCalendarios, imprimir
        };
    }
}).mount('#app');
</script>
</body>
</html>
