<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Roteiro da Presidência - ALRS</title>
<!-- Vue.js 3 via CDN -->
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<!-- Supabase JS v2 via CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root { --bg-app: #cbd5e1; --doc-bg: #ffffff; --text-main: #000000; --text-instrucao: #C00000; --border-color: #000000; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background-color: var(--bg-app); font-family: Arial, Helvetica, sans-serif; color: var(--text-main); line-height: 1.4; }

/* BARRA DE SELEÇÃO DO PRESIDENTE */
#barra-presidente {
    background: #1e293b; color: white; padding: 12px 20px; position: sticky; top: 0; z-index: 100;
    display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
}
.seletores-box { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; flex: 1; }
.seletores-box label { font-size: 12px; font-weight: bold; color: #94a3b8; }
.seletores-box select { padding: 8px 12px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; font-weight: bold; cursor: pointer; }
.acoes-box { display: flex; gap: 8px; }
button { padding: 8px 14px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 12px; text-transform: uppercase; transition: 0.15s; }
.btn-refresh { background: #3b82f6; color: white; } .btn-refresh:hover { background: #2563eb; }
.btn-print { background: #10b981; color: white; } .btn-print:hover { background: #059669; }

/* A FOLHA A4 */
.folha-a4 { background: var(--doc-bg); width: 210mm; min-height: 297mm; margin: 25px auto; padding: 18mm 15mm; box-shadow: 0 10px 25px rgba(0,0,0,0.15); font-size: 11pt; }
.titulo-roteiro { border-top: 2px solid var(--border-color); border-bottom: 2px solid var(--border-color); padding: 8px; text-align: center; font-weight: bold; margin-bottom: 16px; text-transform: uppercase; }
.instrucao { color: var(--text-instrucao); font-style: italic; font-weight: bold; text-align: center; margin: 14px 0; }
.item-texto { margin-bottom: 10px; text-align: justify; }
.item-destaque { background: #e2e2e2; padding: 5px 8px; font-weight: bold; font-size: 12pt; border: 1px solid var(--border-color); margin-bottom: 10px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.item-ordem-dia { margin-bottom: 35px; page-break-inside: avoid; border-bottom: 1px dotted #ccc; padding-bottom: 20px; }

.caixa-secao { border: 2px solid var(--border-color); background-color: #e2e2e2; text-align: center; font-weight: bold; text-transform: uppercase; padding: 6px; margin: 26px 0 14px 0; font-size: 12pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

table.tabela-roteiro { width: 100%; border-collapse: collapse; margin: 12px 0; page-break-inside: avoid; }
table.tabela-roteiro th, table.tabela-roteiro td { border: 1px solid var(--border-color); padding: 5px 6px; text-align: left; vertical-align: middle; }
table.tabela-roteiro th { background-color: #f1f1f1; font-weight: bold; text-align: center; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.col-check { width: 32px; text-align: center !important; font-weight: bold; }
.col-nome { width: 42%; font-size: 10pt; }

.tabela-vista { width: auto; margin: 10px auto; border-collapse: collapse; font-size: 10pt; }
.tabela-vista th, .tabela-vista td { border: 1px solid #000; padding: 4px 10px; text-align: center; font-weight: bold; }
.tabela-vista th.label-vista { background-color: #e2e2e2; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

.linha-vazia { display: inline-block; width: 45px; border-bottom: 1px solid black; text-align: center; font-weight: bold; }

.distribuicao-container { display: flex; gap: 20px; align-items: stretch; margin-bottom: 20px; }
.distribuicao-tabela-box { flex: 0 0 45%; }
.distribuicao-tabela-box table { margin: 0; font-size: 9pt; }
.distribuicao-tabela-box th, .distribuicao-tabela-box td { padding: 4px; }
.distribuicao-texto-box { flex: 1; display: flex; flex-direction: column; justify-content: center; text-align: center; }
.linha-destaque { background-color: #fcd34d !important; font-weight: bold; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.linha-impedida { color: #999; text-decoration: line-through; }

.calendarios-container { display: flex; justify-content: center; gap: 20px; margin-top: 25px; page-break-inside: avoid; }
.calendario { border: 1px solid #000; padding: 10px; border-radius: 4px; font-size: 9pt; width: 185px; }
.cal-mes { text-align: center; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; font-size: 10pt; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; gap: 3px; }
.cal-header { font-weight: bold; color: #444; font-size: 8pt; border-bottom: 1px solid #ccc; padding-bottom: 3px; margin-bottom: 3px; }
.cal-day.domingo, .cal-day.sabado { color: #C00000; font-weight: bold; }
.cal-day.vazio { color: transparent; }

@media (max-width: 850px) {
    .folha-a4 { width: 98%; padding: 10px; margin: 10px auto; }
}
@media print {
    .no-print { display: none !important; }
    body { background: none; }
    .folha-a4 { margin: 0; padding: 0; box-shadow: none; width: 100%; min-height: auto; }
    table.tabela-roteiro, .calendarios-container { page-break-inside: avoid; }
    .caixa-secao { page-break-after: avoid; }
    @page { margin: 15mm; }
}
</style>
</head>
<body>

<div id="app">
    <!-- BARRA DE SELEÇÃO DA PRESIDÊNCIA -->
    <div id="barra-presidente" class="no-print">
        <div class="seletores-box">
            <label>COMISSÃO:</label>
            <select v-model="comissaoSelecionada" @change="carregarReunioesDaComissao">
                <option v-for="c in comissoes" :key="c.sigla" :value="c.sigla">{{ c.sigla }} — {{ c.nome }}</option>
            </select>

            <label style="margin-left: 10px;">REUNIÃO:</label>
            <select v-model="reuniaoSelecionadaId" @change="carregarRoteiroEspecifico" style="min-width: 260px;">
                <option v-if="listaReunioes.length === 0" :value="null">Nenhuma reunião publicada para esta comissão</option>
                <option v-for="r in listaReunioes" :key="r.id" :value="r.id">
                    📅 {{ formatarData(r.data_reuniao) }} às {{ r.hora_inicio }} ({{ r.tipo_reuniao }})
                </option>
            </select>
        </div>

        <div class="acoes-box">
            <button class="btn-refresh" @click="carregarRoteiroEspecifico" :disabled="!reuniaoSelecionadaId || carregando">
                {{ carregando ? 'Atualizando...' : '🔄 Atualizar' }}
            </button>
            <button class="btn-print" @click="imprimir" :disabled="!roteiroCarregado">🖨️ Imprimir</button>
        </div>
    </div>

    <!-- FOLHA A4 DE LEITURA DO PRESIDENTE -->
    <div class="folha-a4">
        <div v-if="carregando" style="text-align: center; padding: 60px; color: #475569;">
            <h3>Carregando roteiro da reunião...</h3>
        </div>
        <div v-else-if="!roteiroCarregado" style="text-align: center; padding: 60px; color: #64748b;">
            <h2>Roteiro da Presidência — ALRS</h2>
            <p style="margin-top: 10px;">Selecione a comissão e a data da reunião na barra superior para exibir o roteiro.</p>
        </div>

        <template v-else>
            <!-- CABEÇALHO -->
            <div class="titulo-roteiro">
                {{ formatarDataMesExtensoCurto(pauta.metadados.data) }} – {{ formatarHoraRoteiro(pauta.metadados.hora_inicio) }} – {{ pauta.metadados.local }}<br>
                REUNIÃO {{ (pauta.metadados.tipo_reuniao || 'ORDINÁRIA').toUpperCase() }} – FORMATO {{ (pauta.metadados.modalidade || 'HÍBRIDO').toUpperCase() }}
            </div>

            <div class="instrucao">
                AVISAR A EQUIPE DA TV SOBRE A ABERTURA DA REUNIÃO EM INSTANTES (UM MINUTO)<br>
                <span style="font-size: 10pt; color: #000; font-weight: normal; font-style: normal;">
                    <i>para abertura, necessária presença mínima de 3 Deputados / presidente + 2</i><br><br>
                    <i>se decorridos 15 minutos não houver sido atingido o quórum, o Presidente declarará:<br>
                    Conforme Art. 59. § 1.º do Regimento Interno da Assembleia Legislativa, sem o quórum necessário, com a presença dos deputados XXXX, esta reunião deixa de realizar-se, com o fato sendo registrado em Ata Declaratória</i>
                </span>
            </div>

            <div style="text-align: justify; font-size: 11.5pt; line-height: 1.5; font-weight: bold;">
                HAVENDO QUÓRUM REGIMENTAL, DECLARO ABERTA A REUNIÃO {{ (pauta.metadados.tipo_reuniao || 'ORDINÁRIA').toUpperCase() }} 
                {{ (pauta.metadados.modalidade || 'HÍBRIDA').toUpperCase() }} DA 
                {{ (nomeComissaoCompleto || pauta.metadados.comissao || pauta.metadados.sigla).toUpperCase() }} NESTA
                <div style="text-align: center; font-size: 13pt; margin-top: 8px;">
                    {{ textoAberturaDinamico }}
                </div>
            </div>

            <div style="text-align: center; font-size: 10pt; margin-top: 12px; margin-bottom: 8px; font-style: italic;">
                Presidente nomina cada um dos Parlamentares presentes, solicitando manifestação ao microfone para registro documental
            </div>

            <!-- TABELA DE PRESENÇA (ABERTURA) -->
            <table class="tabela-roteiro">
                <thead>
                    <tr>
                        <th class="col-nome">MEMBROS TITULARES</th><th class="col-check">✓</th>
                        <th class="col-nome">MEMBROS SUPLENTES</th><th class="col-check">✓</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(linha, index) in tabelaMembros" :key="'abert'+index">
                        <td class="col-nome">{{ formatarNomeMembro(linha.titular) }}</td><td class="col-check"></td>
                        <td class="col-nome">{{ formatarNomeMembro(linha.suplente) }}</td><td class="col-check"></td>
                    </tr>
                </tbody>
            </table>

            <!-- SEÇÃO I - ATAS -->
            <div class="caixa-secao">APROVAÇÃO DE ATAS ANTERIORES</div>
            <p v-if="pauta.aprovacao_atas.atas.length === 0">Não há atas a serem aprovadas.</p>
            <div v-for="(ata, idx) in pauta.aprovacao_atas.atas" :key="'ata'+idx" class="item-texto">
                Declaro aprovada a <strong>ata {{ ata.numero }}</strong>, da {{ ata.tipo_reuniao ? ata.tipo_reuniao.toLowerCase() : 'reunião ordinária' }} de {{ formatarDataExtenso(ata.reuniao_referencia) }}, ressalvado aos parlamentares o direito de retificá-la, por escrito.
            </div>

            <!-- SEÇÃO II - EXPEDIENTE -->
            <div class="caixa-secao">LEITURA DO EXPEDIENTE</div>
            
            <div v-if="pauta.leitura_expediente.correspondencias_recebidas.length > 0">
                <strong>COMUNICO CORRESPONDÊNCIA RECEBIDA:</strong>
                <div v-for="(item, idx) in pauta.leitura_expediente.correspondencias_recebidas" :key="'corr'+idx" class="item-texto" style="margin-top: 6px;">
                    {{ idx + 1 }}. <strong v-if="item.remetente">{{ item.remetente }}:</strong> {{ item.mensagem }}
                </div>
            </div>

            <div v-if="pauta.leitura_expediente.proposicoes_recebidas.length > 0" style="margin-top: 15px;">
                <strong>COMUNICO PROPOSIÇÃO RECEBIDA:</strong><br><br>
                <div v-for="(item, idx) in pauta.leitura_expediente.proposicoes_recebidas" :key="'rec'+idx" class="item-texto">
                    {{ idx + 1 }}. <strong>{{ item.tipo }} n.º {{ item.numero }}/{{ item.ano }}</strong><br>
                    Proponente: {{ item.proponente_principal?.nome || item.proponente_cru }}<br>
                    Ementa: {{ item.ementa }} <span v-if="item.votacao_conclusiva" style="text-decoration: underline;">(Tramitação Conclusiva)</span>.
                </div>
                <div v-if="pauta.leitura_expediente.proposicoes_recebidas.some(i => i.sujeita_emendas)" style="text-align: center; font-weight: bold; text-transform: uppercase; margin-top: 15px; border-bottom: 2px solid var(--border-color); padding-bottom: 15px; margin-bottom: 15px;">
                    INFORMO PRAZO DE 7 DIAS PARA RECEBIMENTO DE EMENDAS CONFORME REGIMENTO INTERNO.
                </div>
            </div>

            <div v-if="pauta.leitura_expediente.proposicoes_distribuidas.length > 0" style="margin-top: 15px;">
                <strong>COMUNICO PROPOSIÇÕES DISTRIBUÍDAS:</strong><br><br>
                <div v-for="(item, idx) in pauta.leitura_expediente.proposicoes_distribuidas" :key="'pdist'+idx" class="item-texto">
                    {{ idx + 1 }}. <strong>{{ item.tipo }} n.º {{ item.numero }}/{{ item.ano }}</strong><br>
                    Proponente: {{ item.proponente_principal?.nome || item.proponente_cru }}<br>
                    Ementa: {{ item.ementa }}<br>
                    Relator: {{ item.relator?.nome || item.relator_cru || '_________' }}<br>
                    Data de Distribuição: {{ formatarData(item.data_distribuicao) || '_________________' }}
                </div>
            </div>

            <!-- DISTRIBUIÇÃO DE MATÉRIAS -->
            <div v-if="pauta.leitura_expediente.materias_a_distribuir.length > 0" style="margin-top: 15px;">
                <strong>COMUNICO PROPOSIÇÃO PARA DISTRIBUIÇÃO:</strong><br><br>
                <div v-for="(item, idx) in pauta.leitura_expediente.materias_a_distribuir" :key="'dist'+idx" class="item-texto" style="margin-bottom: 35px; border-bottom: 1px dashed #ccc; padding-bottom: 20px;">
                    {{ idx + 1 }}. <strong>{{ item.tipo }} n.º {{ item.numero }}/{{ item.ano }}</strong><br>
                    Proponente: {{ item.proponente_principal?.nome || item.proponente_cru }}<br>
                    Ementa: {{ item.ementa }}<br><br>
                    
                    <div class="distribuicao-container">
                        <div class="distribuicao-tabela-box">
                            <table class="tabela-roteiro">
                                <thead><tr><th colspan="2">TITULARES (Ordem Alfabética)</th></tr></thead>
                                <tbody>
                                    <tr v-for="dep in titularesApenasOrdemAlfabetica" :key="dep.id" 
                                        :class="{'linha-destaque': preparo.relatores_grade?.[item.id] === dep.id, 'linha-impedida': item.bancada_impedida && dep.partido === item.bancada_impedida}">
                                        <td>{{ dep.nome }}</td>
                                        <td style="text-align: center;">{{ dep.partido }}</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <div class="distribuicao-texto-box">
                            <div style="font-weight: bold; margin-bottom: 15px;">ALGUM PARLAMENTAR DESEJA RELATAR A MATÉRIA?</div>
                            <div>NÃO HAVENDO INTERESSADO, OU SEM ACORDO, PELA GRADE O RELATOR SERÁ O DEPUTADO:</div>
                            <div style="color: var(--text-instrucao); font-size: 13pt; font-weight: bold; text-transform: uppercase; margin: 10px 0;">
                                {{ getNomeRelator(preparo.relatores_grade?.[item.id]) || '_________________________' }}
                            </div>
                            <div style="font-style: italic; font-size: 9pt; margin-top: 12px;">
                                NÃO PODERÃO SER RELATORES (Art. 61-A)<br>
                                <span style="color: var(--text-instrucao); font-weight: bold;">--- {{ item.bancada_impedida ? '(' + item.bancada_impedida + ')' : 'Nenhuma (Autor Órgão/Externo)' }}</span><br>
                                <span style="font-size: 8pt; display: block; margin-top: 4px;">{{ getListaNomesImpedidos(item.bancada_impedida) }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SEÇÃO III - CONHECIMENTO -->
            <div class="caixa-secao">CONHECIMENTO DE MATÉRIAS DE ALÇADA DA COMISSÃO</div>
            <p v-if="!temConhecimento">Nada consta.</p>
            
            <div v-for="(item, idx) in pauta.conhecimento_materias.informativos" :key="'inf'+idx" class="item-texto">
                {{ idx + 1 }}. {{ item.texto }}
                <div v-if="item.requer_deliberacao" style="text-align: center; font-weight: bold; margin-top: 8px;">
                    OS PARLAMENTARES CONCORDAM? ( &nbsp;&nbsp; ) APROVADO.
                </div>
            </div>

            <div v-for="(item, idx) in pauta.conhecimento_materias.deliberativos_administrativos" :key="'deladm'+idx" class="item-texto">
                - {{ item.texto }}
                <div style="text-align: center; font-weight: bold; margin-top: 8px;">
                    OS PARLAMENTARES CONCORDAM? ( &nbsp;&nbsp; ) APROVADO.
                </div>
            </div>

            <div v-if="pauta.conhecimento_materias.audiencias_agendadas.length > 0" style="margin-top: 15px;">
                <div v-for="(aud, idx) in pauta.conhecimento_materias.audiencias_agendadas" :key="'aud'+idx" class="item-texto">
                    - <strong>Audiência Pública Agendada:</strong><br>
                    Data: {{ formatarData(aud.data) }} {{ aud.hora ? ' – ' + aud.hora : '' }} | Local: {{ aud.local }}<br>
                    Proponente: {{ aud.proponente?.nome || aud.proponente_cru }}<br>
                    Pauta: {{ aud.pauta }}
                </div>
            </div>

            <div v-if="pauta.conhecimento_materias.requerimentos_conhecimento.length > 0" style="margin-top: 15px;">
                <div style="font-weight: bold;">Requerimentos para conhecimento:</div>
                <div v-for="(req, idx) in pauta.conhecimento_materias.requerimentos_conhecimento" :key="'req'+idx" class="item-texto">
                    {{ idx + 1 }}) {{ req.tipo }} n.º {{ req.numero }}/{{ req.ano }} - {{ req.texto }}
                </div>
            </div>

            <!-- VERIFICAÇÃO DE QUÓRUM -->
            <div class="caixa-secao" style="page-break-before: always;">VERIFICAÇÃO DE QUÓRUM</div>
            <div style="text-align: center; font-weight: bold; margin-bottom: 6px;">
                PARA PROSSEGUIRMOS, CONTAMOS COM A PRESENÇA DOS PARLAMENTARES...
            </div>
            <div class="instrucao" style="margin-top: 4px;">
                Presidente nomina cada um dos Parlamentares presentes, solicitando manifestação ao microfone para registro documental / virtual com câmera ligada OU Informar que visivelmente há quórum, com presenças mencionadas anteriormente<br>
                <span style="font-size: 10pt; color: #000; font-weight: bold; font-style: normal; display: block; margin-top: 6px;">
                    Para Ordem do Dia, necessária presença mínima 7 Parlamentares / presidente + 6
                </span>
            </div>

            <table class="tabela-roteiro">
                <thead>
                    <tr>
                        <th class="col-nome">MEMBROS TITULARES</th><th class="col-check">✓</th>
                        <th class="col-nome">MEMBROS SUPLENTES</th><th class="col-check">✓</th>
                    </tr>
                </thead>
                <tbody>
                    <tr v-for="(linha, index) in tabelaMembros" :key="'delib'+index">
                        <td class="col-nome">{{ formatarNomeMembro(linha.titular) }}</td><td class="col-check"></td>
                        <td class="col-nome">{{ formatarNomeMembro(linha.suplente) }}</td><td class="col-check"></td>
                    </tr>
                </tbody>
            </table>

            <p style="text-align: center; font-size: 11.5pt; font-weight: bold; margin: 18px 0; line-height: 2;">
                ( &nbsp;&nbsp; ) HAVENDO QUÓRUM para deliberar, passamos à ORDEM DO DIA.<br>
                ( &nbsp;&nbsp; ) NÃO HAVENDO QUÓRUM para deliberar, passamos aos ASSUNTOS GERAIS.
            </p>

            <!-- SEÇÃO IV - ORDEM DO DIA -->
            <div class="caixa-secao" style="page-break-before: always;">ORDEM DO DIA</div>
            <p v-if="pauta.ordem_do_dia.length === 0">Não há matérias na Ordem do Dia.</p>
            
            <div v-for="(item, idx) in pauta.ordem_do_dia" :key="'od'+idx" class="item-ordem-dia">
                <div class="item-destaque">
                    {{ idx + 1 }}) {{ item.tipo_extenso || item.tipo }} n.º {{ item.numero }}/{{ item.ano }}
                </div>

                <div v-if="['PL', 'PLC', 'PEC', 'PDL', 'PRES'].includes(item.tipo) && !ehFaseB(item)" class="instrucao" style="margin-top: 6px; margin-bottom: 10px;">
                    VERIFICAR A PRESENÇA DO RELATOR – Se não estiver presente, leitura/votação fica para próxima reunião
                </div>

                <div style="margin-bottom: 8px;">
                    <strong v-if="item.proponente_principal || item.proponente_cru">Proponente:</strong> {{ item.proponente_principal?.nome ? 'Deputado(a) ' + item.proponente_principal.nome : item.proponente_cru }} {{ item.coautores_adicionais ? `+ ${item.coautores_adicionais} Deputado(s)` : '' }}<br>
                    <template v-if="preparo.historico?.[item.id]?.demais_integrantes">
                        <strong>Demais Integrantes:</strong> {{ preparo.historico[item.id].demais_integrantes }}<br>
                    </template>
                    
                    <template v-if="item.tipo === 'RAP'">
                        <strong>Assunto:</strong> {{ item.ementa }}<br>
                        <strong v-if="item.local">Local:</strong> {{ item.local }}<br>
                        <strong v-if="item.convidados && item.convidados.length > 0">Convidados:</strong>
                        <ul style="margin-left: 20px; font-size: 10pt;">
                            <li v-for="c in item.convidados" :key="c">{{ c }}</li>
                        </ul>
                    </template>
                    <template v-else>
                        <strong>Ementa:</strong> {{ item.ementa }}<br>
                    </template>
                </div>

                <template v-if="!ehFaseB(item)">
                    <div v-if="item.votacao_conclusiva" style="text-align: center; font-weight: bold; margin: 10px 0; text-transform: uppercase;">
                        PROJETO COM TRAMITAÇÃO CONCLUSIVA NESTA COMISSÃO
                    </div>
                    <div style="margin-bottom: 10px;">
                        <strong v-if="item.relator || item.relator_cru">Relator:</strong> {{ item.relator?.nome ? 'Deputado(a) ' + item.relator.nome : (item.relator_cru || '_________') }} &nbsp;&nbsp;&nbsp;&nbsp; 
                        <strong v-if="item.parecer">Parecer:</strong> {{ formatarParecer(item.parecer) }}
                    </div>
                </template>
                <template v-else>
                    <div style="font-weight: bold; margin: 10px 0; text-align: justify;">

<script>
const SUPABASE_URL = 'https://stwdytpfdizwtaqtrarq.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_cfCVWR24Jq4NripFuSo4xA_GFixfQGk';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const { createApp, ref, reactive, computed, onMounted } = Vue;

createApp({
    setup() {
        const comissoes = ref([]);
        const comissaoSelecionada = ref('CEDST');
        const listaReunioes = ref([]);
        const reuniaoSelecionadaId = ref(null);
        const carregando = ref(false);
        const roteiroCarregado = ref(false);

        const pauta = reactive({
            metadados: {}, aprovacao_atas: { atas: [] },
            leitura_expediente: { correspondencias_recebidas: [], proposicoes_recebidas: [], proposicoes_distribuidas: [], materias_a_distribuir: [] },
            conhecimento_materias: { informativos: [], requerimentos_conhecimento: [], deliberativos_administrativos: [], audiencias_agendadas: [] },
            ordem_do_dia: [], assuntos_gerais: { itens: [], proxima_reuniao: null, proxima_reuniao_custom: '' }
        });
        const snapshotMembros = reactive({ presidente_id: null, vice_presidente_id: null, titulares: [], suplentes: [] });
        const preparo = reactive({ relatores_grade: {}, historico: {} });

        onMounted(async () => {
            const { data } = await sb.from('comissoes').select('sigla, nome').order('sigla');
            if (data) comissoes.value = data;
            await carregarReunioesDaComissao();
        });

        async function carregarReunioesDaComissao() {
            carregando.value = true;
            roteiroCarregado.value = false;
            const { data } = await sb.from('reunioes')
                .select('id, data_reuniao, hora_inicio, tipo_reuniao')
                .eq('comissao_sigla', comissaoSelecionada.value)
                .order('data_reuniao', { ascending: false });
            listaReunioes.value = data || [];
            carregando.value = false;

            if (listaReunioes.value.length > 0) {
                reuniaoSelecionadaId.value = listaReunioes.value[0].id;
                await carregarRoteiroEspecifico();
            } else {
                reuniaoSelecionadaId.value = null;
            }
        }

        async function carregarRoteiroEspecifico() {
            if (!reuniaoSelecionadaId.value) return;
            carregando.value = true;
            const { data, error } = await sb.from('reunioes').select('*').eq('id', reuniaoSelecionadaId.value).single();
            carregando.value = false;
            if (error || !data) return alert('Não foi possível carregar o roteiro.');

            Object.assign(pauta, data.pauta_json);
            Object.assign(snapshotMembros, data.snapshot_membros);
            preparo.relatores_grade = data.preparo_json?.relatores_grade || {};
            preparo.historico = data.preparo_json?.historico || {};
            roteiroCarregado.value = true;
        }

        const nomeComissaoCompleto = computed(() => {
            const com = comissoes.value.find(c => c.sigla === pauta.metadados.sigla);
            return com ? com.nome : pauta.metadados.comissao;
        });

        const titularesOrdenados = computed(() => {
            const tits = [...(snapshotMembros.titulares || [])];
            const presId = snapshotMembros.presidente_id;
            const viceId = snapshotMembros.vice_presidente_id;
            const marcados = tits.map(m => ({
                ...m, id: m.id_assembleia || m.id,
                isPresidente: (m.id_assembleia || m.id) === presId,
                isVice: (m.id_assembleia || m.id) === viceId
            }));
            const presidente = marcados.find(t => t.isPresidente);
            const outros = marcados.filter(t => !t.isPresidente).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
            return presidente ? [presidente, ...outros] : outros;
        });

        const titularesApenasOrdemAlfabetica = computed(() => [...(snapshotMembros.titulares || [])].map(m => ({...m, id: m.id_assembleia || m.id})).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR')));
        const suplentesOrdenados = computed(() => [...(snapshotMembros.suplentes || [])].map(m => ({...m, id: m.id_assembleia || m.id})).sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR')));

        const tabelaMembros = computed(() => {
            const linhas = []; const t = titularesOrdenados.value; const s = suplentesOrdenados.value;
            for(let i=0; i<12; i++) linhas.push({ titular: t[i] || null, suplente: s[i] || null });
            return linhas;
        });

        function formatarNomeMembro(membro) {
            if (!membro) return '';
            let sufixo = '';
            if (membro.isPresidente) sufixo = ' | Presidente';
            else if (membro.isVice) sufixo = ' | Vice-presidente';
            return `${membro.nome} (${membro.partido})${sufixo}`;
        }

        const todosMembrosSnapshot = computed(() => [...(snapshotMembros.titulares || []), ...(snapshotMembros.suplentes || [])].map(m => ({...m, id: m.id_assembleia || m.id})));
        const bancadasComissao = computed(() => {
            const bancadas = new Set();
            todosMembrosSnapshot.value.forEach(dep => { if(dep.partido) bancadas.add(dep.partido); });
            return Array.from(bancadas).sort();
        });

        const temConhecimento = computed(() => {
            const c = pauta.conhecimento_materias;
            return (c.informativos?.length > 0) || (c.deliberativos_administrativos?.length > 0) || (c.audiencias_agendadas?.length > 0) || (c.requerimentos_conhecimento?.length > 0);
        });

        function ehFaseB(it) { return !!it._fase_b || (it.votacao_conclusiva && !it.relator && !it.parecer); }
        function elegivelNovoRelator(tipo) { return ['PL', 'PLC', 'PEC', 'PDL', 'RDI'].includes(tipo); }

        function gerarResumoPareceresFaseB(it) {
            if (!it.pareceres_anteriores || it.pareceres_anteriores.length === 0) return '';
            const partes = it.pareceres_anteriores.map(pa => {
                const sentido = pa.parecer === 'favoravel_com_emendas' ? 'favorável com emenda' : (pa.parecer === 'contrario' ? 'contrário' : 'favorável');
                const ehCCJ = /Constitui[çc][ãa]o\s+e\s+Justi[çc]a/i.test(pa.comissao);
                const local = ehCCJ ? 'na CCJ' : 'nesta comissão';
                return `${sentido} ${local}, relator(a) Deputado(a) ${pa.relator}`;
            });
            return `Projeto recebeu parecer ${partes.join(', e ')}.`;
        }

        function bancadaJaPediuVista(itemId, sigla) {
            const lista = preparo.historico?.[itemId]?.vistas_detalhadas || [];
            return lista.some(v => v.bancada === sigla);
        }

        function getListaNomesImpedidos(bancadaImpedida) {
            if (!bancadaImpedida) return '';
            const imp = String(bancadaImpedida).toUpperCase();
            const nomes = titularesApenasOrdemAlfabetica.value.filter(d => (d.partido || '').toUpperCase() === imp).map(d => d.nome);
            return nomes.length > 0 ? `(${nomes.join(', ')})` : '';
        }

        function getNomeRelator(id) {
            if (!id) return null;
            const dep = todosMembrosSnapshot.value.find(d => d.id === id);
            return dep ? `${dep.nome} (${dep.partido})` : null;
        }

        function formatarData(isoData) {
            if (!isoData) return '';
            const p = isoData.split('-');
            return p.length === 3 ? `${p[2]}/${p[1]}/${p[0]}` : isoData;
        }

        function formatarDataMesExtensoCurto(isoData) {
            if (!isoData) return '';
            const p = isoData.split('-');
            if (p.length !== 3) return isoData;
            const meses = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
            return `${p[2]}/${meses[parseInt(p[1], 10) - 1]}/${p[0]}`;
        }

        function formatarHoraRoteiro(hora) { return hora ? hora.replace(':', 'H') : '09H00'; }

        function formatarDataExtenso(strData) {
            if (!strData) return '';
            if (strData.includes(' de ')) return strData;
            const p = strData.split('-');
            if (p.length !== 3) return strData;
            const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
            return `${parseInt(p[2], 10)} de ${meses[parseInt(p[1], 10)-1]} de ${p[0]}`;
        }

        function formatarParecer(parecer) {
            if (!parecer) return '_________';
            if (parecer === 'favoravel') return 'Favorável';
            if (parecer === 'favoravel_com_emendas') return 'Favorável com emendas';
            return 'Contrário';
        }

        function formatarStringEmenda(num, conectivo = '+') {
            if (!num || num <= 0) return '';
            if (num === 1) return `${conectivo} ${conectivo === 'E' ? 'A ' : ''}EMENDA`;
            return `${conectivo} ${conectivo === 'E' ? 'AS ' : ''}EMENDAS`;
        }

        const textoAberturaDinamico = computed(() => {
            if(!pauta.metadados.data) return "DATA NÃO IDENTIFICADA, PRESENTES ...";
            const [y, m, d] = pauta.metadados.data.split('-');
            const date = new Date(y, m - 1, d);
            const dias = ['DOMINGO', 'SEGUNDA-FEIRA', 'TERÇA-FEIRA', 'QUARTA-FEIRA', 'QUINTA-FEIRA', 'SEXTA-FEIRA', 'SÁBADO'];
            const meses = ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
            return `${dias[date.getDay()]} DIA ${d} DE ${meses[date.getMonth()]} DE ${y}, PRESENTES ...`;
        });

        const listaCalendarios = computed(() => {
            const dataBase = pauta.metadados.data ? pauta.metadados.data : new Date().toISOString().split('T')[0];
            const [y, m] = dataBase.split('-');
            let currentDate = new Date(y, m - 1, 1);
            const cals = [];
            const mesesStr = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
            for(let i=0; i<3; i++) {
                const ano = currentDate.getFullYear(); const mes = currentDate.getMonth();
                const diasNoMes = new Date(ano, mes + 1, 0).getDate();
                const diaSemanaInicio = new Date(ano, mes, 1).getDay(); 
                const diasArray = Array(42).fill(null);
                for(let dia = 1; dia <= diasNoMes; dia++) diasArray[diaSemanaInicio + dia - 1] = dia;
                if(!diasArray.slice(35).some(Boolean)) diasArray.splice(35);
                cals.push({ mesAno: `${mesesStr[mes]} ${ano}`, dias: diasArray });
                currentDate.setMonth(currentDate.getMonth() + 1);
            }
            return cals;
        });

        function imprimir() { window.print(); }

        return {
            comissoes, comissaoSelecionada, listaReunioes, reuniaoSelecionadaId, carregando, roteiroCarregado,
            carregarReunioesDaComissao, carregarRoteiroEspecifico,
            pauta, preparo, nomeComissaoCompleto, tabelaMembros, formatarNomeMembro,
            titularesApenasOrdemAlfabetica, bancadasComissao, temConhecimento,
            ehFaseB, elegivelNovoRelator, gerarResumoPareceresFaseB, bancadaJaPediuVista, getListaNomesImpedidos, getNomeRelator,
            formatarData, formatarDataMesExtensoCurto, formatarHoraRoteiro, formatarDataExtenso, formatarParecer, formatarStringEmenda,
            textoAberturaDinamico, listaCalendarios, imprimir
        };
    }
}).mount('#app');
</script>
</body>
</html>
