<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Check-in de Pauta — ALRS/CEDST</title>
<link rel="stylesheet" href="style.css">
<script>
/* Aplica o tema antes do 1º paint (mesma chave do sistema ao vivo). */
(function(){try{var t=localStorage.getItem('ui_theme')||'light';document.documentElement.setAttribute('data-theme',t);}catch(e){}})();
</script>
<style>
/* ══════════════════════════════════════════════════════════════
   Estilos específicos do check-in. Herda tokens e componentes do
   style.css; aqui só o layout desktop-first e o painel de avisos.
   Sem arquivo CSS à parte (decisão de projeto).
   ══════════════════════════════════════════════════════════════ */
body{height:100vh;height:100dvh;overflow:hidden;display:flex;flex-direction:column}

/* Cabeçalho */
#ci-hdr{height:48px;flex-shrink:0;background:var(--brand);color:var(--on-brand);
  display:flex;align-items:center;gap:12px;padding:0 16px}
#ci-hdr .ci-title{font-weight:800;font-size:15px}
#ci-hdr .ci-sub{font-size:12px;opacity:.75}
#ci-hdr .ci-sp{flex:1}
#ci-hdr button{background:rgba(255,255,255,.12);color:var(--on-brand);border:none;
  border-radius:var(--radius);padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;
  display:inline-flex;align-items:center;gap:6px;transition:.15s}
#ci-hdr button:hover{background:rgba(255,255,255,.22)}
#ci-hdr button:disabled{opacity:.4;cursor:not-allowed}
#ci-theme{width:34px;height:34px;border-radius:50%!important;justify-content:center;padding:0!important}

/* Corpo: duas colunas no desktop (avisos | conteúdo), 1 no tablet */
#ci-main{flex:1;display:flex;overflow:hidden}
#ci-avisos{width:320px;flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);
  overflow-y:auto;padding:16px}
#ci-conteudo{flex:1;overflow-y:auto;padding:20px 24px}
#ci-conteudo-inner{max-width:900px;margin:0 auto}

/* Tela inicial (sem arquivo) */
#ci-empty{flex:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;text-align:center;padding:24px}
#ci-empty h1{font-size:24px;font-weight:800;color:var(--text)}
#ci-empty p{color:var(--text-muted);font-size:14px;max-width:440px;line-height:1.5}
.ci-drop{border:2px dashed var(--border);border-radius:12px;padding:40px 48px;transition:.15s;cursor:pointer}
.ci-drop:hover,.ci-drop.drag{border-color:var(--accent);background:var(--surface-2)}

/* Painel de avisos (a assinatura do check-in) */
.ci-av-head{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  color:var(--text-faint);margin-bottom:12px}
.ci-av-count{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;
  padding:0 6px;border-radius:10px;font-size:11px;font-weight:700;margin-left:6px}
.ci-av-count.warn{background:var(--warn-bg);color:var(--warn-fg)}
.ci-av-count.err{background:var(--err-bg);color:var(--err-fg)}
.ci-av-count.ok{background:var(--ok-bg);color:var(--ok-fg)}
.ci-aviso{border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:12px;line-height:1.4;
  cursor:pointer;border-left:3px solid transparent;transition:.12s}
.ci-aviso:hover{filter:brightness(1.03)}
.ci-aviso.err{background:var(--err-bg);color:var(--err-fg);border-left-color:var(--red)}
.ci-aviso.warn{background:var(--warn-bg);color:var(--warn-fg);border-left-color:var(--amber)}
.ci-aviso.info{background:var(--info-bg);color:var(--info-fg);border-left-color:var(--blue)}
.ci-aviso .ci-av-t{font-weight:700;display:block;margin-bottom:2px}
.ci-av-vazio{color:var(--text-faint);font-size:12px;text-align:center;padding:24px 0}

/* Seções do conteúdo (reusa .sec do style.css, mas sempre abertas aqui) */
.ci-sec{background:var(--surface);border-radius:8px;box-shadow:var(--shadow-sm);margin-bottom:14px;overflow:hidden}
.ci-sec-hdr{background:var(--surface-2);color:var(--text);padding:10px 14px;font-weight:700;font-size:13px;
  display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--border)}
.ci-sec-hdr .ci-sec-n{color:var(--text-faint);font-weight:800}
.ci-sec-body{padding:14px}
.ci-sec-vazia{color:var(--text-faint);font-size:12px;font-style:italic}

/* Item (proposição, correspondência, etc.) */
.ci-item{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;background:var(--surface)}
.ci-item:last-child{margin-bottom:0}
.ci-item-top{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;flex-wrap:wrap}
.ci-item-tipo{font-weight:800;font-size:13px;color:var(--accent)}
.ci-item-ementa{font-size:13px;color:var(--text);line-height:1.4;margin:4px 0}
.ci-item-meta{font-size:12px;color:var(--text-muted);line-height:1.5}
.ci-item-meta b{color:var(--text);font-weight:600}

/* Campo com selo "confira" (Nível 2 — revisão dirigida) */
.ci-confira{position:relative;border-left:3px solid var(--amber);padding-left:10px;margin:6px 0}
.ci-selo{display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.4px;color:var(--amber);margin-left:6px}
.ci-campo-vazio{color:var(--text-faint);font-style:italic}

/* Linha editável */
.ci-edit-row{display:flex;align-items:center;gap:8px;margin:6px 0;flex-wrap:wrap}
.ci-edit-row label{font-size:12px;color:var(--text-muted);min-width:120px;font-weight:600}
.ci-edit-row select,.ci-edit-row input{flex:1;min-width:160px}
.ci-edit-row textarea{flex:1 1 100%;width:100%;box-sizing:border-box;padding:8px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);font-size:13px}
.ci-edit-row textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}

/* Rodapé de ações */
#ci-foot{flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);
  padding:10px 20px;display:flex;align-items:center;gap:12px;justify-content:flex-end}
#ci-foot .ci-foot-info{margin-right:auto;font-size:12px;color:var(--text-muted)}

/* Responsivo: tablet empilha avisos acima do conteúdo */
@media (max-width:820px){
  #ci-main{flex-direction:column}
  #ci-avisos{width:auto;max-height:38vh;border-right:none;border-bottom:1px solid var(--border)}
}

/* Modo checkout (leitura): esconde controles de edição, mostra leitura */
.ci-read-view{display:none}                       /* por padrão (check-in) esconde leitura */
body.ci-readonly .ci-edit-only{display:none!important}
body.ci-readonly .ci-read-view{display:block}     /* no checkout mostra leitura */
.ci-modo-badge{font-size:11px;font-weight:700;padding:2px 10px;border-radius:20px}
.ci-modo-badge.checkin{background:var(--info-bg);color:var(--info-fg)}
.ci-modo-badge.checkout{background:var(--ok-bg);color:var(--ok-fg)}

/* Leitura técnica (JSON read-only) */
#ci-json-view{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;
  line-height:1.55;white-space:pre-wrap;word-break:break-word;color:var(--text);
  background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:16px}
#ci-json-view .jk{color:var(--accent)}          /* chave */
#ci-json-view .js{color:var(--ok-fg)}           /* string */
#ci-json-view .jn{color:var(--warn-fg)}         /* número */
#ci-json-view .jb{color:var(--err-fg);font-weight:700}  /* boolean/null */
.ci-json-hint{font-size:11px;color:var(--text-faint);margin-bottom:10px;padding:8px 10px;
  background:var(--surface-2);border-radius:6px}
</style>
</head>
<body>

<header id="ci-hdr">
  <span class="ci-title">Check-in de Pauta</span>
  <span class="ci-sub" id="ci-hdr-sub">Assembleia Legislativa do RS</span>
  <span id="ci-modo" class="ci-modo-badge" style="display:none"></span>
  <span class="ci-sp"></span>
  <span id="ci-cad-fonte" class="ci-sub"></span>
  <button id="ci-visao" title="Alternar visão guiada / leitura técnica (JSON)">⌁ Ver JSON</button>
  <button id="ci-carregar" class="ci-edit-only">📂 Carregar outro</button>
  <button id="ci-theme" title="Alternar tema">🌙</button>
</header>

<!-- Tela inicial -->
<div id="ci-empty">
  <div class="ci-drop" id="ci-drop">
    <h1>Conferir pauta extraída</h1>
    <p>Carregue o JSON gerado pela IA para revisar as seções, ver os avisos automáticos e corrigir o que precisar antes de levar ao sistema da reunião.</p>
    <button class="btn btn-primary" id="ci-abrir" style="margin-top:16px">📂 Carregar Pauta (JSON)</button>
  </div>
  <div id="ci-cad-fonte-empty" class="ci-sub" style="color:var(--text-faint)"></div>
</div>

<!-- Área de trabalho (oculta até carregar) -->
<div id="ci-main" style="display:none">
  <aside id="ci-avisos">
    <div class="ci-av-head">Avisos <span id="ci-av-count" class="ci-av-count ok">0</span></div>
    <div id="ci-avisos-list"></div>
  </aside>
  <div id="ci-conteudo">
    <div id="ci-conteudo-inner"></div>
    <div id="ci-json-view" style="display:none"></div>
  </div>
</div>

<!-- Rodapé de ações (oculto até carregar) -->
<footer id="ci-foot" style="display:none">
  <span class="ci-foot-info" id="ci-foot-info"></span>
  <button class="btn btn-ghost ci-doc-btn" id="ci-doc-ata" style="display:none">📄 Ata textual (.doc)</button>
  <button class="btn btn-ghost ci-doc-btn" id="ci-doc-resumo-pdf" style="display:none">🖨 Resumo (.pdf)</button>
  <button class="btn btn-ghost ci-doc-btn" id="ci-doc-resumo-doc" style="display:none">📄 Resumo (.doc)</button>
  <button class="btn btn-ghost ci-edit-only" id="ci-descartar">Descartar alterações</button>
  <button class="btn btn-primary ci-edit-only" id="ci-exportar">Exportar pauta revisada</button>
  <button class="btn btn-ghost" id="ci-fechar" style="display:none">Fechar</button>
</footer>

<input type="file" id="ci-file" accept=".json,application/json" style="display:none">

<script src="cadastros.js"></script>
<script src="documentos.js"></script>
<script src="checkin.js"></script>
</body>
</html>
