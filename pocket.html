<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><title>Pocket · Roteiro Inteligente ALRS</title>
<script src="https://unpkg.com/vue@3.5.13/dist/vue.global.prod.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js"></script>
<style>
:root{font-family:Arial,Helvetica,sans-serif;color:#f8fafc;background:#0f172a;color-scheme:dark}*{box-sizing:border-box}body{margin:0}[v-cloak]{display:none}button,input,select{font:inherit;border:1px solid #475569;border-radius:10px;background:#1e293b;color:inherit;padding:10px;min-height:44px}input,select{font-size:16px;width:100%;min-width:0}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #38bdf8;outline-offset:2px}button[aria-pressed=true],.selecionado{outline:2px solid #38bdf8;background:#164e63}h1,h2,h3,p{margin:0 0 12px}h1{font-size:24px}h2{font-size:20px}h3{font-size:16px}label{display:grid;gap:6px;margin:12px 0}small,.muted{color:#94a3b8;font-size:12px;line-height:1.4}fieldset{border:0;margin:0;padding:0;min-width:0}summary{padding:12px 0;cursor:pointer}details p{line-height:1.45;white-space:pre-line}#app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;max-width:720px;margin:auto;padding-top:env(safe-area-inset-top)}.topo{padding:8px 12px;background:#0f172a;border-bottom:1px solid #334155;flex-shrink:0}.linha-topo{display:flex;align-items:center;gap:6px}.reuniao-atalho{flex:1;min-width:0;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px}.sync{font-size:11px;white-space:nowrap}.sync::before{content:'●';margin-right:4px}.sync.ok{color:#6ee7b7}.sync.pendente{color:#fcd34d}.sync.erro{color:#fca5a5}.sync.inativo{color:#94a3b8}.globais,.navegacao{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.globais{margin-top:6px}.globais button{padding:8px 3px;font-size:13px}.sessao{display:flex;align-items:center;gap:4px;margin-top:6px;min-height:44px;font-size:13px}.sessao button{min-width:44px;padding:6px}.sessao strong{margin-right:auto}.sessao-normal{color:#86efac}.sessao-alerta{color:#fcd34d}.sessao-limite{color:#fca5a5}.deck{flex:1;overflow-y:auto;overscroll-behavior:contain;min-height:0;padding:12px}.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px;margin-bottom:12px}.posicao{color:#7dd3fc;font-size:12px;line-height:1.5;margin-bottom:6px}.navegacao{padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:#0f172a;border-top:1px solid #334155;flex-shrink:0}.navegacao button{font-size:14px;padding:10px 4px}.dupla{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pilhas{display:grid;gap:8px}.bom{background:#065f46;color:#ecfdf5;border-color:#10b981}.ruim{background:#7f1d1d;color:#fff1f2;border-color:#f87171}.aviso{background:#422006;color:#fde68a;border:1px solid #b45309;border-radius:10px;padding:10px;margin:10px 0;line-height:1.4}.badge{display:inline-block;background:#0f172a;color:#bae6fd;padding:5px 8px;border-radius:6px;font-size:12px;margin:2px}.placar{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:center;margin:12px 0}.placar strong{display:block;font-size:38px;font-variant-numeric:tabular-nums}.placar>div{border-radius:12px;padding:12px 4px;background:#0f172a}.favoravel{color:#6ee7b7}.contrario{color:#fca5a5}.incremento{display:grid;grid-template-columns:56px 1fr;gap:8px;margin:8px 0}.incremento button{min-height:52px;font-weight:bold}.alvos{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 8px}.alvos button{white-space:nowrap;flex-shrink:0}.suspenso{border:1px solid #f59e0b;background:#422006;padding:14px;border-radius:12px}.grade-presenca{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grade-presenca button{width:100%;font-size:13px;text-align:left;margin:3px 0;min-height:48px;overflow-wrap:anywhere}.grade-presenca button[aria-pressed=true],.presente{background:#064e3b;color:#d1fae5}.total{font-size:28px;font-weight:bold;margin:12px 0}.leitura{white-space:pre-line;line-height:1.5}.indice button{display:block;width:100%;text-align:left;margin:6px 0}.indice button small{display:block}.voto-linha{display:grid;grid-template-columns:minmax(0,1fr) 52px 52px;gap:8px;align-items:center;margin:8px 0}.voto-linha span{font-size:14px}.voto-linha small{display:block}
dialog{color:inherit;background:#0f172a;border:1px solid #475569;border-radius:20px 20px 0 0;padding:0;width:min(100%,720px);max-width:100%;max-height:92dvh;margin:auto auto 0;box-shadow:0 -12px 48px #0008}dialog::backdrop{background:#0009}.sheet-topo{position:sticky;top:0;display:flex;align-items:center;justify-content:space-between;background:#0f172a;padding:12px;z-index:2;border-bottom:1px solid #334155}.sheet-topo h2{margin:0}.sheet-corpo{padding:14px 14px calc(16px + env(safe-area-inset-bottom));overflow-y:auto}.sheet-sala{margin:0 auto 0 0;height:100dvh;max-height:100dvh;width:min(92%,440px);border-radius:0 18px 18px 0}.sheet-quadro{height:100dvh;max-height:100dvh;border-radius:0}.sheet-quadro .sheet-topo{padding:6px 12px}.sheet-quadro .sheet-corpo{padding-top:8px}.quadro-cabecalho h3{font-size:14px;margin-bottom:5px}.quadro-cabecalho p{font-size:12px;margin-bottom:5px}.quadro-tabela{width:100%;border-collapse:collapse;font-size:12px}.quadro-tabela td{border-bottom:1px solid #334155;padding:3px 2px}.quadro-tabela button{min-height:32px;font-size:11px;padding:4px;white-space:nowrap}.quadro-tabela td:nth-child(2){width:100%}.quadro-tabela small{display:block;font-size:10px}.quadro-total{font-weight:bold;text-align:center;margin:10px 0}.tempo-visor{padding:16px 0;display:grid;gap:6px;text-align:center}.tempo-visor strong{font-size:52px;font-variant-numeric:tabular-nums}.tempo-modos{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tempo-botoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.tempo-botoes button{flex:1}.tempo-normal{color:#67e8f9}.tempo-alerta{background:#422006!important;color:#fde68a!important}.tempo-critico{background:#7f1d1d!important;color:#fee2e2!important;animation:pulso 1s infinite}@keyframes pulso{50%{opacity:.65}}@media(prefers-reduced-motion:reduce){.tempo-critico{animation:none}}@media print{.no-screenshot{display:none}}
</style></head><body>
<div id="app" v-cloak>
<header class="topo"><div class="linha-topo"><span class="sync" :class="classeAutoSync" role="status">{{ classeAutoSync }}</span><button v-if="erroAutoSync" @click="tentarSincronizar" aria-label="Tentar sincronizar novamente">↻</button><button class="reuniao-atalho" @click="abrirSheet('conta')">{{ reuniaoAtualUuid ? pauta.metadados.sigla + ' · ' + formatarData(pauta.metadados.data) + ' · ' + pauta.metadados.hora_inicio : 'ALRS · Entrar / escolher reunião' }} ▾</button></div>
<div class="sessao"><template v-if="aoVivo.sessao_duracao.status === 'parado'"><button :disabled="!podeInteragir" @click="acaoSessao('iniciar')">▶ Iniciar 2h</button><small>Duração da sessão</small></template><template v-else><strong :class="sessaoVisor.classe">Sessão {{ sessaoVisor.texto }}</strong><button :disabled="!podeInteragir" @click="acaoSessao(aoVivo.sessao_duracao.status === 'rodando' ? 'pausar' : 'iniciar')" aria-label="Pausar ou retomar sessão">{{ aoVivo.sessao_duracao.status === 'rodando' ? '⏸' : '▶' }}</button><button :disabled="!podeInteragir" @click="acaoSessao('zerar')" aria-label="Zerar sessão">↺</button></template></div>
<div class="globais"><button :disabled="!reuniaoAtualUuid" @click="abrirSheet('sala')">◉ Sala ({{ contarPresentes('pres_atual') }})</button><button :disabled="!reuniaoAtualUuid" :class="aoVivo.cronometro.status !== 'parado' ? visor.classe : ''" @click="abrirSheet('fala')">🎙 Fala {{ visor.texto }}</button><button :disabled="!reuniaoAtualUuid" @click="abrirSheet('quadro')">▦ Titulares P/F</button></div></header>
<main class="deck" ref="deck"><p v-if="statusBanco" class="aviso" role="status">{{ statusBanco }}</p><div v-if="!reuniaoAtualUuid" class="card"><p class="posicao">ROTEIRO INTELIGENTE · POCKET</p><h1>Condução na palma da mão</h1><p>Entre com sua conta e escolha uma reunião já preparada.</p><button class="bom" @click="abrirSheet('conta')">Conta e reunião</button></div>
<template v-else><label class="posicao">EM PAUTA<select :disabled="!podeInteragir" :value="chaveFoco" @change="selecionarFoco($event.target.value)"><option v-for="f in indice" :key="chave(f)" :value="chave(f)">{{ f.rotulo }}</option></select></label><p v-if="!usuarioLogado" class="aviso">Entre na conta para habilitar os controles.</p>
<fieldset :disabled="!podeInteragir">
<section v-if="secao === 'abertura' || secao === 'quorum'" class="card"><h2>{{ secao === 'abertura' ? 'Fotografia de Abertura' : 'Verificação de Quórum' }}</h2><div class="total">{{ contarPresentes(campoFoto) }} / {{ secao === 'abertura' ? 3 : 7 }}</div><p :class="contarPresentes(campoFoto) >= (secao === 'abertura' ? 3 : 7) ? 'favoravel' : 'contrario'">{{ contarPresentes(campoFoto) >= (secao === 'abertura' ? 3 : 7) ? 'ATINGIDO ✓' : 'AGUARDANDO' }}</p><div class="pilhas"><button :aria-pressed="fotografiaTravada(campoFoto)" @click="alternarTrava(secao === 'abertura' ? 'trava_abertura' : 'trava_deliberacao')">{{ fotografiaTravada(campoFoto) ? '🔒 Fotografia travada (Destravar)' : '🔓 Travar fotografia' }}</button><template v-if="!fotografiaTravada(campoFoto)"><button @click="puxarFoto">Puxar presentes da sala agora ({{ contarPresentes('pres_atual') }})</button><button v-if="secao === 'quorum'" @click="copiarPresentesAbertura">Copiar da Abertura ({{ contarPresentes('pres_abertura') }})</button></template></div>
<template v-if="secao === 'quorum'"><div class="pilhas" style="margin-top:12px"><button class="bom" @click="decidirQuorum('sim')">✅ HAVENDO QUÓRUM → Ordem do Dia</button><button class="ruim" @click="decidirQuorum('nao')">❌ NÃO HAVENDO → Assuntos Gerais</button></div><details><summary>Ajustar nomes na fotografia</summary><grade-presenca :grupos="gruposSala" :marcas="aoVivo.pres_deliberacao" :bloqueado="!podeInteragir || aoVivo.trava_deliberacao" @marcar="alternarPresenca('pres_deliberacao', $event)"></grade-presenca></details></template><grade-presenca v-else :grupos="gruposSala" :marcas="aoVivo.pres_abertura" :bloqueado="!podeInteragir || aoVivo.trava_abertura" @marcar="alternarPresenca('pres_abertura', $event)"></grade-presenca></section>
<section v-else-if="itemFoco && ['mad','od'].includes(descritor?.grupo)" class="card"><p class="posicao">{{ descritor.rotulo }}</p><h1>{{ tituloItem(itemFoco) }}</h1><span v-if="ehFaseB(itemFoco)" class="badge">⚡ Fase B · Conclusiva</span><span v-else-if="itemFoco.votacao_conclusiva" class="badge">⚡ {{ itemFoco.texto_conclusiva || 'Tramitação Conclusiva' }}</span><span v-if="historico.is_relatorio_lido" class="badge">Relatório já lido</span><span v-for="v in historico.vistas_detalhadas || []" class="badge">Vista anterior: {{ v.bancada }} · {{ v.deputado }}</span><p class="muted">Proponente: {{ autor(itemFoco.proponente_principal, itemFoco.proponente_cru) }}</p><p v-if="descritor.grupo === 'od' && exibirBlocoRelatorParecer(itemFoco)" class="muted">Relator: {{ autor(itemFoco.relator, itemFoco.relator_cru) }} · Parecer: {{ formatarParecer(itemFoco.parecer) }}</p><details><summary>Ementa / detalhes</summary><p>{{ itemFoco.ementa }}</p><p v-if="itemFoco.local">Local: {{ itemFoco.local }} {{ itemFoco.modalidade }}</p><p v-if="itemFoco.convidados?.length">Convidados: {{ itemFoco.convidados.join('; ') }}</p><p v-for="pa in itemFoco.pareceres_anteriores || []">{{ pa.comissao }} · {{ formatarParecer(pa.parecer) }} · {{ pa.relator }}</p></details>
<template v-if="descritor.grupo === 'mad'"><p class="aviso">Bancada impedida (Art. 61-A): {{ itemFoco.bancada_impedida || 'Não informada / órgão externo' }}</p><label>Relator pela Grade<select :value="preparo.relatores_grade[itemFoco.id] || ''" @change="definirRelatorGrade(itemFoco.id,$event.target.value)"><option value="">— Sem designação —</option><option v-for="d in elegiveis" :value="d.id">{{ d.nome }} ({{ d.partido }})</option></select></label><label>Relator Efetivo / Acordo<select :value="aoVivo.relatores_escolhidos[itemFoco.id] || ''" @change="definirCampo('relatores_escolhidos',itemFoco.id,$event.target.value)"><option value="">— Usar grade —</option><option v-for="d in membrosConducao" :value="d.id">{{ d.nome }} ({{ d.partido }})</option></select></label><p class="favoravel">Designado: {{ getNomeRelator(aoVivo.relatores_escolhidos[itemFoco.id] || preparo.relatores_grade[itemFoco.id]) || 'Em aberto' }}</p></template>
<template v-else><div v-if="suspenso" class="suspenso"><p>{{ aoVivo.vista_em_sessao[itemFoco.id] ? '✋ VISTA: ' + aoVivo.vista_em_sessao[itemFoco.id] : '' }}</p><p>{{ aoVivo.ocorrencia_od[itemFoco.id]?.texto }}</p><button v-if="aoVivo.vista_em_sessao[itemFoco.id]" @click="definirCampo('vista_em_sessao',itemFoco.id,'')">Remover vista</button><button v-if="aoVivo.ocorrencia_od[itemFoco.id]" @click="definirOcorrencia(itemFoco,'')">Remover ocorrência</button></div>
<template v-else><div class="alvos" v-if="emendas.length"><button :aria-pressed="alvo === null" @click="alvo = null">Projeto Principal</button><button v-for="n in emendas" :aria-pressed="alvo === n" @click="alvo = n">Emenda {{ n }}</button></div><div class="placar"><div class="favoravel">Favoráveis<strong>{{ contarVotos(itemFoco.id,'F',alvo) || 0 }}</strong></div><div class="contrario">Contrários<strong>{{ contarVotos(itemFoco.id,'C',alvo) || 0 }}</strong></div></div><p class="muted">{{ placarRapido(itemFoco.id,alvo) ? 'Placar rápido · sobrepõe a contagem nominal' : 'Contagem nominal' }} · {{ alvo ? 'Emenda ' + alvo : 'Proposição principal' }}</p><div class="incremento"><button @click="ajustarPlacar(itemFoco,'F',-1,alvo)">−F</button><button class="bom" @click="ajustarPlacar(itemFoco,'F',1,alvo)">＋1 FAVORÁVEL (F)</button></div><div class="incremento"><button @click="ajustarPlacar(itemFoco,'C',-1,alvo)">−C</button><button class="ruim" @click="ajustarPlacar(itemFoco,'C',1,alvo)">＋1 CONTRÁRIO (C)</button></div><div class="pilhas"><button :disabled="!presentesVotacao.length" @click="preencherVotosPresentes(itemFoco,false,alvo)">✅ Todos Presentes = F ({{ presentesVotacao.length }})</button><button :disabled="!presentesVotacao.length" @click="preencherVotosPresentes(itemFoco,true,alvo)">✅ Restantes = F</button></div><div class="dupla" style="margin:8px 0"><button @click="abrirSheet('votos')">Votos nominais F/C</button><button @click="limparVotos(itemFoco,alvo)">Limpar votos</button></div><small>Resultado regimental · marcação manual</small><div class="dupla" style="margin:8px 0"><button class="bom" :aria-pressed="resultado === 'aprovado'" @click="marcarResultado(itemFoco,'aprovado',alvo)">✅ APROVADO</button><button class="ruim" :aria-pressed="resultado === 'rejeitado'" @click="marcarResultado(itemFoco,'rejeitado',alvo)">❌ REJEITADO</button></div><template v-if="alvo === null"><template v-if="itemFoco.eleicao"><p v-if="historico.indicado_eleicao" class="aviso">Indicação: {{ historico.indicado_eleicao }}</p><label>Deputado(a) eleito(a)<select :value="aoVivo.eleitos[itemFoco.id] || ''" @change="definirCampo('eleitos',itemFoco.id,$event.target.value)"><option value="">— Não declarado —</option><option v-for="d in membrosConducao" :value="d.id">{{ d.nome }}</option></select></label></template><label v-if="resultado === 'rejeitado' && !ehFaseB(itemFoco) && elegivelNovoRelator(itemFoco.tipo)">Novo relator (Art. 67)<select :value="aoVivo.novo_relator_art67[itemFoco.id] || ''" @change="definirCampo('novo_relator_art67',itemFoco.id,$event.target.value)"><option value="">— Não designado —</option><option v-for="d in membrosConducao" :value="d.id">{{ d.nome }} ({{ d.partido }})</option></select></label></template></template>
<label v-if="itemFoco.permite_pedido_vista && !historico.vedado_mais_vistas">✋ Conceder vista em sessão<select :value="aoVivo.vista_em_sessao[itemFoco.id] || ''" @change="definirCampo('vista_em_sessao',itemFoco.id,$event.target.value)"><option value="">— Sem vista —</option><option v-for="d in membrosConducao" :disabled="(historico.vistas_detalhadas || []).some(v => v.bancada === d.partido)" :value="'BANCADA ' + d.partido + ' – DEP. ' + d.nome.toUpperCase()">{{ d.partido }} – {{ d.nome }}</option></select></label><label>⏸ Outra ocorrência<select :value="aoVivo.ocorrencia_od[itemFoco.id]?.tipo || ''" @change="definirOcorrencia(itemFoco,$event.target.value)"><option value="">— Votação normal —</option><option v-for="(o,k) in OCORRENCIAS_OD" :value="k">{{ o.rotulo }}</option></select></label></template></section>
<section v-else class="card"><h2>{{ tituloSecao }}</h2><p v-if="aoVivo.foco_pauta?.item_id && !descritor" class="aviso">Item em foco não encontrado. Escolha outro item no índice.</p><article v-for="(c,i) in cartoes" :key="i" style="margin-bottom:16px"><h3>{{ c.titulo }}</h3><p class="leitura">{{ c.texto }}</p></article><button v-if="descritor && (descritor.grupo === 'deladm' || descritor.grupo === 'inf' && descritor.item.requer_deliberacao)" class="bom" :aria-pressed="!!aoVivo[descritor.grupo === 'inf' ? 'res_info' : 'res_delib'][descritor.indice]" @click="alternarMarca(descritor.grupo === 'inf' ? 'res_info' : 'res_delib',descritor.indice)">✅ ({{ aoVivo[descritor.grupo === 'inf' ? 'res_info' : 'res_delib'][descritor.indice] ? 'X' : ' ' }}) APROVADO PELOS PARLAMENTARES</button></section>
</fieldset></template></main>
<nav class="navegacao" aria-label="Navegação da pauta"><button :disabled="!podeInteragir" @click="avancarFoco(-1)">⬅ Anterior</button><button :disabled="!reuniaoAtualUuid" @click="abrirSheet('indice')">☷ Ir para...</button><button :disabled="!podeInteragir" @click="avancarFoco(1)">Próximo ➡</button></nav>
<dialog ref="dialog" :class="'sheet-' + sheet" @close="!dialog?.open && (sheet = '')" @click="fecharFundo"><div class="sheet-topo no-screenshot"><h2>{{ nomesSheets[sheet] }}</h2><button @click="fecharSheet" aria-label="Fechar gaveta">✕</button></div><div class="sheet-corpo">
<template v-if="sheet === 'conta'"><p class="posicao">ALRS · CONSOLE DE BOLSO</p><form v-if="!usuarioLogado" @submit.prevent="entrar"><label>E-mail<input type="email" v-model="email" autocomplete="username" required></label><label>Senha<input type="password" v-model="senha" autocomplete="current-password" required></label><button class="bom" :disabled="authOcupado">Entrar</button></form><template v-else><p>{{ usuarioLogado.email }}</p><button @click="sair" :disabled="authOcupado || carregando">Sair da conta</button></template><p class="aviso" v-if="erroAuth">{{ erroAuth }}</p><label>Comissão<select v-model="comissao" @change="listarReunioes"><option value="">Todas</option><option v-for="c in comissoes" :value="c.sigla">{{ c.sigla }} — {{ c.nome }}</option></select></label><label>Reunião salva<select v-model="escolhida"><option value="">Escolha uma reunião</option><option v-for="r in reunioes" :value="r.id">{{ r.comissao_sigla }} · {{ formatarData(r.data_reuniao) }} · {{ r.hora_inicio }}</option></select></label><button class="bom" :disabled="!escolhida || carregando" @click="carregarReuniao">{{ carregando ? 'Carregando...' : 'Abrir reunião' }}</button><button @click="listarReunioes">↻ Atualizar lista</button><p class="aviso" v-if="statusBanco">{{ statusBanco }}</p><hr><div class="pilhas"><button :disabled="!reuniaoAtualUuid" @click="copiarResumoReuniao">Copiar resumo</button><button :disabled="!reuniaoAtualUuid" @click="abrirSheet('youtube')">Transmissão YouTube</button><button class="ruim" :disabled="!podeInteragir" @click="zerarAoVivo">Zerar Ao Vivo</button></div><p class="muted" style="margin-top:12px">{{ recepcao.conexao.value }} · Use uma estação por vez para alterar a mesma votação. Alterações simultâneas não são mescladas.</p></template>
<template v-else-if="sheet === 'sala'"><p class="total">Na sala agora: {{ contarPresentes('pres_atual') }}</p><p class="muted">Abertura (3): {{ contarPresentes('pres_atual') >= 3 ? '✓' : 'aguardando' }} · Deliberação (7): {{ contarPresentes('pres_atual') >= 7 ? '✓' : 'aguardando' }}</p><grade-presenca :grupos="gruposSala" :marcas="aoVivo.pres_atual" :bloqueado="!podeInteragir" @marcar="alternarPresenca('pres_atual',$event)"></grade-presenca><p class="muted">Esta grade altera somente a presença atual na sala.</p></template>
<widget-cronometro v-else-if="sheet === 'fala'" :estado="aoVivo.cronometro" :permitido="podeInteragir" :membros="oradoresSala" :rapido="true" @alterar="atualizarCronometro"></widget-cronometro>

function itensFocoPauta(pauta) {
    const e = pauta.leitura_expediente || {}, c = pauta.conhecimento_materias || {};
    const grupos = [
        ['expediente', 'corr', 'Leitura do Expediente', 'Correspondência', e.correspondencias_recebidas],
        ['expediente', 'rec', 'Leitura do Expediente', 'Proposição recebida', e.proposicoes_recebidas],
        ['expediente', 'dist', 'Leitura do Expediente', 'Proposição distribuída', e.proposicoes_distribuidas],
        ['distribuicao', 'mad', 'Matérias a Distribuir', 'Item', e.materias_a_distribuir],
        ['conhecimento', 'inf', 'Conhecimento de Matérias', 'Informativo', c.informativos],
        ['conhecimento', 'deladm', 'Conhecimento de Matérias', 'Deliberação', c.deliberativos_administrativos],
        ['conhecimento', 'aud', 'Conhecimento de Matérias', 'Audiência', c.audiencias_agendadas],
        ['conhecimento', 'req', 'Conhecimento de Matérias', 'Requerimento', c.requerimentos_conhecimento],
        ['ordem_do_dia', 'od', 'Ordem do Dia', 'Item', pauta.ordem_do_dia],
        ['assuntos_gerais', 'ag', 'Assuntos Gerais', 'Item', pauta.assuntos_gerais?.itens]
    ];
    const itens = grupos.flatMap(([secao, grupo, titulo, especie, lista]) => (lista || []).map((item, indice) => ({
        secao, grupo, item, indice, total: lista.length, ancora: `${grupo}-${indice}`,
        item_id: ['rec','dist','mad','req','od'].includes(grupo) && item?.id ? String(item.id) : `${grupo}-${indice}`,
        rotulo: `${titulo} — ${especie} ${indice + 1} de ${lista.length}` + (item?.tipo ? `: ${item.tipo} ${item.numero || ''}/${item.ano || ''}` : '')
    })));
    // Uma proposição pode aparecer em duas alíneas do mesmo Expediente.
    // Nessa colisão, a âncora da alínea desambigua o foco sem alterar IDs legislativos.
    const contagens = new Map();
    for (const it of itens) { const chave = `${it.secao}:${it.item_id}`; contagens.set(chave, (contagens.get(chave) || 0) + 1); }
    return itens.map(it => contagens.get(`${it.secao}:${it.item_id}`) > 1 ? { ...it, item_id: it.ancora } : it);

function extrairIdYoutube(input) {
    if (typeof input !== 'string') return '';
    const texto = input.trim(), valido = v => /^[A-Za-z0-9_-]{11}$/.test(v || '');
    if (valido(texto)) return texto;
    try {
        const url = new URL(/^(?:www\.|m\.)?(?:youtube\.com|youtu\.be)\//i.test(texto) ? 'https://' + texto : texto);
        if (!['https:', 'http:'].includes(url.protocol) || url.username || url.password || url.port) return '';
        const host = url.hostname.toLowerCase(), partes = url.pathname.split('/').filter(Boolean);
        let id = '';
        if (['youtu.be', 'www.youtu.be'].includes(host) && partes.length === 1) id = partes[0];
        else if (['youtube.com', 'www.youtube.com', 'm.youtube.com'].includes(host)) {
            if (url.pathname === '/watch') id = url.searchParams.get('v');

}
function tempoDecorrido(c, agora = Date.now()) {

}
function visorCronometro(c, agora = Date.now()) {

    const absoluto = Math.floor(Math.abs(valor));

        texto: (valor < 0 ? '-' : '') + String(Math.floor(absoluto / 60)).padStart(2, '0') + ':' + String(absoluto % 60).padStart(2, '0'),

}

        const daSecao = itens.value.filter(it => it.secao === secao).map(it => criarFoco(secao, it.item_id, it.indice));

            const primeiro = lista.findIndex(f => f.secao === atual.secao);

        }
        const foco = { ...lista[idx < 0 ? (delta > 0 ? 0 : lista.length - 1) : Math.max(0, Math.min(lista.length - 1, idx + delta))] };
        edicao.value.foco_pauta = foco;
        await nextTick();
        if (permitido.value && focoIgual(edicao.value.foco_pauta, foco))

        if (foco.item_id) {

        if (permitido.value) edicao.value.cronometro = criarAoVivo({ cronometro: c }).cronometro;
    }
    return { focoAtivo, destacarFoco, avancarFoco, ancoraFoco, atualizarCronometro, idFocoItem };
}
function usarTelaAtiva(ativo) {
    let trava = null, solicitando = false, encerrado = false;
    async function atualizar() {
        if (encerrado || !ativo() || document.visibilityState !== 'visible') {
            const anterior = trava; trava = null;
            if (anterior) { try { await anterior.release(); } catch {} }
            return;
        }
        if (trava || solicitando || !navigator.wakeLock) return;
        solicitando = true;
        try {
            const obtida = await navigator.wakeLock.request('screen');
            if (encerrado || !ativo() || document.visibilityState !== 'visible') await obtida.release();
            else {
                trava = obtida;
                obtida.addEventListener('release', () => { if (trava === obtida) trava = null; }, { once: true });
            }
        } catch {} finally { solicitando = false; }
    }
    watch(ativo, atualizar);
    onMounted(() => { document.addEventListener('visibilitychange', atualizar); atualizar(); });
    onBeforeUnmount(() => { encerrado = true; document.removeEventListener('visibilitychange', atualizar); atualizar(); });
}

    }
